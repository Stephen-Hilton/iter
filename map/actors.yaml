# The people and programs at the edge of iter4's map. Each `uses` pattern
# names interfaces (by id) the actor calls; the map draws an edge from the
# actor to the part that provides each.
actors:
  - id: developer
    name: "Developer"
    description: "A person who files work, answers questions, reads the map and grows the project from it, in the web page."
    uses:
      - pattern: "webui-page"
  - id: operator
    name: "Operator"
    description: "The person who stands iter up: runs the container, registers engines, mints tokens, migrates data."
    uses:
      - pattern: "webui-page"
  - id: agent
    name: "Claude agent"
    description: "A headless Claude Code session an engine starts for one work item; it calls the `iter` verbs from inside the checkout."
    uses:
      - pattern: "workitem-create"
