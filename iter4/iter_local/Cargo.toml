[package]
name = "iter_local"
version = "0.1.0"
edition = "2024"
description = "The local-file half of iter4: the structureV2 marker scan, node ids, the graph snapshot, testgroups, the deterministic test runner and validate"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
serde_yaml = "0.9"
base64 = "0.22"
