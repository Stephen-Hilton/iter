# iter4 all-in-one (ArangoDB CE + iter_data). Works the same in Docker Desktop
# and on a small VM / EC2 instance.
#   docker compose -f docker/compose.yml up -d --build
# Secrets come from run/docker.env (written by ./deploy.sh docker from the
# repo .env: ITER_ADMIN_PASSWORD, ITER_JWT_SECRET, ARANGO_ROOT_PASSWORD).
name: iter4
services:
  iter4:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: iter4:latest
    container_name: iter4
    restart: unless-stopped
    ports:
      - "${ITER_PORT:-8300}:8300"
      # the Arango web console; bound to localhost only
      - "127.0.0.1:${ARANGO_HOST_PORT:-8530}:8529"
    env_file:
      - path: ../run/docker.env
        required: false
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:-iter4dev}
    volumes:
      - arango:/var/lib/arangodb3
      - iterdata:/var/lib/iter
volumes:
  arango:
  iterdata:
