[package]
name = "iter_rag"
version = "0.1.0"
edition = "2024"

# GraphRAG's shared text + embedding code (2026-09-29): the engine runs it for
# bulk work (extraction, chunking, chunk and summary vectors); iter_data runs
# only the embedder, for search questions.
[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = "0.22"
pdf-extract = "0.12.1"
lopdf = "0.42"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
serde_json = "1.0"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
