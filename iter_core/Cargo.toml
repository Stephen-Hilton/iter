[package]
name = "iter_core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
serde_yaml = "0.9"
glob = "0.3.4"
sha2 = "0.10"
# enginekey: join codes (base64url) and the public-certificate check both programs make
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# rag/ (GraphRAG text extraction, chunking, embedding; was the iter_rag crate)
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = "0.22"
pdf-extract = "0.12.1"
lopdf = "0.42"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
