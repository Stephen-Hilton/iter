# ArangoDB for iter5 (linux/install.sh): the docker image's config, but
# localhost only. vector-index: GraphRAG's vector indexes (3.12.4+).
vector-index = true

[database]
directory = /var/lib/arangodb3

[server]
endpoint = tcp://127.0.0.1:8529
authentication = true
statistics = true

[javascript]
startup-directory = /usr/share/arangodb3/js
app-path = /var/lib/arangodb3-apps

[log]
level = info
file = -
