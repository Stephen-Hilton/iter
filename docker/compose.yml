# iter5 all-in-one (ArangoDB CE + iter_data). Works the same in Docker Desktop
# and on a small VM / EC2 instance.
#   docker compose -f docker/compose.yml up -d --build
# Secrets come from run/docker.env (written by ./deploy.sh docker from the
# repo .env: ITER_ADMIN_PASSWORD, ITER_JWT_SECRET, ARANGO_ROOT_PASSWORD).
name: iter5
services:
  iter5:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: iter5:latest
    container_name: iter5
    restart: unless-stopped
    # hard cap (memswap_limit = mem_limit: no swap on top)
    mem_limit: ${ITER_MEM_LIMIT:-6g}
    memswap_limit: ${ITER_MEM_LIMIT:-6g}
    ports:
      - "${ITER_PORT:-8400}:8400"
      # the Arango web console; bound to localhost only
      - "127.0.0.1:${ARANGO_HOST_PORT:-8630}:8529"
    env_file:
      - path: ../run/docker.env
        required: false
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:-iter4dev}
      # arangod sizes its caches and AQL limits from the host's RAM, not the
      # cgroup limit above; leave headroom for iter_data in the same container
      ARANGODB_OVERRIDE_DETECTED_TOTAL_MEMORY: ${ITER_ARANGO_MEMORY:-5G}
    # everything that persists (database, Arango apps, iter_data's files) in
    # one host folder, e.g. ~/.iter5/iter_data (deploy.ps1 / deploy.sh set it)
    volumes:
      - ${ITER_DATA_DIR:?set ITER_DATA_DIR to the host folder for iter_data}:/var/lib/iter_data
