# iter_data all-in-one (ArangoDB CE + iter_data). Works the same in Docker Desktop
# and on a small VM / EC2 instance. install.sh copies this into <iter dir>/iter_data/docker
# and sets every variable below; by hand, from that folder:
#   ITER_DATA_DIR=/opt/iter/iter_data ITER_ENV_PATH=/opt/iter/iter_data/config/data.env \
#     docker compose -p iter5 -f compose.yml -f compose.console.yml up -d --build
# ITER_ENV_PATH holds ITER_ADMIN_PASSWORD, ITER_JWT_SECRET, the ArangoDB settings
# (ARANGO_USER + ARANGO_PASSWORD: iter_data's own user, rw on its database only;
# ARANGO_ROOT_PASSWORD; ARANGO_DB; for an existing ArangoDB elsewhere ARANGO_URL plus
# ARANGO_CERT_FINGERPRINT or ARANGO_CA_CERT, and then no arangod runs in the
# container and compose.console.yml is left out) and the TLS settings the entrypoint passes on: ITER_TLS=off (plain HTTP, behind a
# TLS proxy only), ITER_TLS_CERT/ITER_TLS_KEY (a certificate of your own, at its path
# inside the container), ITER_TLS_NAMES (extra names on the self-signed certificate).
# :8400 serves HTTPS by default: https://127.0.0.1:8400/ (self-signed; browsers warn).
# compose.console.yml adds the Arango web console on 127.0.0.1 (leave it out to
# publish only :8400).
# (the service is called iter5 so an existing iter5 compose project is replaced in place)
services:
  iter5:
    build:
      context: .
    image: ${ITER_NAME:-iter5}:latest
    container_name: ${ITER_NAME:-iter5}
    restart: unless-stopped
    # hard cap (memswap_limit = mem_limit: no swap on top)
    mem_limit: ${ITER_MEM_LIMIT:-6g}
    memswap_limit: ${ITER_MEM_LIMIT:-6g}
    ports:
      - "${ITER_PORT:-8400}:8400"
    env_file:
      - path: ${ITER_ENV_PATH:-./docker.env}
        required: false
    environment:
      # arangod sizes its caches and AQL limits from the host's RAM, not the
      # cgroup limit above; leave headroom for iter_data in the same container
      ARANGODB_OVERRIDE_DETECTED_TOTAL_MEMORY: ${ITER_ARANGO_MEMORY:-5G}
    # everything (database in arango/, iter_data's files in state/, config/, backups/)
    # in one host folder, <iter dir>/iter_data, e.g. /opt/iter/iter_data
    volumes:
      - ${ITER_DATA_DIR:?set ITER_DATA_DIR to <iter dir>/iter_data}:/var/lib/iter_data
