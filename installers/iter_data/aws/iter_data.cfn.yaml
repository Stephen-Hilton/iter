AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  iter_data server on one EC2 instance (Amazon Linux 2023, Graviton or x86_64): ArangoDB + iter_data
  as systemd services, installed at first boot by installers/iter_data/linux_aws/install.sh from a
  GitHub Release of Stephen-Hilton/iter (the latest unless IterVersion names one). iter_data serves
  HTTPS with a certificate signed by its own local CA; the fingerprint (what engines pin) is stored in
  SSM, and browsers trust it once an engine is installed on their machine. The
  database lives on its own encrypted EBS volume (or, with ArangoUrl, in an ArangoDB elsewhere), the
  admin password is stored in SSM Parameter Store, and only the iter_data port is reachable from
  AllowedCidr.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Release}
        Parameters: [IterVersion]
      - Label: {default: Machine}
        Parameters: [Architecture, InstanceType, DataVolumeSize]
      - Label: {default: Network}
        Parameters: [VpcId, SubnetId, AllowedCidr, IterPort, SshCidr, KeyName]
      - Label: {default: ArangoDB elsewhere (optional; empty = install ArangoDB on the instance)}
        Parameters: [ArangoUrl, ArangoCertFingerprint, ArangoDb, ArangoUser, ArangoAllowPlainHttp]
    ParameterLabels:
      IterVersion: {default: iter release tag (or latest)}
      AllowedCidr: {default: Who may reach the web page and API}
      ArangoUrl: {default: An existing ArangoDB to use (empty = install one here)}

Parameters:
  IterVersion:
    Type: String
    Default: latest
    AllowedPattern: '^(latest|v[0-9]{4}\.[0-9]{2}\.[0-9]{2}([a-z]|\.[0-9]+)?)$'
    Description: >-
      A release tag such as v2026.10.17, or "latest" to resolve the newest release at first boot.
      The install script and the iter_data binary both come from that release.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: arm64 = Graviton (t4g, m7g, ...); x86_64 = Intel/AMD (t3, m7i, ...). Must match InstanceType.
  InstanceType:
    Type: String
    Default: t4g.large
    Description: >-
      An instance type of the chosen Architecture. t4g.medium (4 GiB) runs a small team;
      t4g.large (8 GiB) is the comfortable default; ArangoDB and iter_data share the memory.
  DataVolumeSize:
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 16384
    Description: >-
      GiB of encrypted gp3 storage for the database and its backups (mounted at /data). With ArangoUrl it
      holds only the backups (of iter's database alone), so the minimum is plenty.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC to run in.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      A subnet of that VPC with a route to the internet (a public subnet, since the instance gets an
      Elastic IP): first boot downloads from GitHub, Docker Hub and Hugging Face.
  AllowedCidr:
    Type: String
    AllowedPattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$'
    Description: >-
      The address range allowed to reach iter_data on IterPort, e.g. your office or VPN range
      (203.0.113.0/24) or 0.0.0.0/0 for anywhere. Engines connect here too.
  IterDir:
    Type: String
    Default: /data/iter
    AllowedPattern: '^/data(/[A-Za-z0-9._-]+)*/iter$'
    Description: >-
      The one folder that holds everything of iter_data (program, config, secrets, ArangoDB and its
      database, backups), on the encrypted data volume mounted at /data so it outlives the instance.
      It ends in /iter.
  IterPort:
    Type: Number
    Default: 8400
    MinValue: 1024
    MaxValue: 65535
    Description: The port iter_data serves the API and web page on.
  SshCidr:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$'
    Description: >-
      Optional address range allowed to SSH (port 22). Leave empty and use SSM Session Manager
      instead (no open port needed).
  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair name for SSH. Leave empty when you use Session Manager.
  ArangoUrl:
    Type: String
    Default: ""
    AllowedPattern: '^$|^local$|^https?://[A-Za-z0-9._:\[\]-]+/?$'
    Description: >-
      Use this ArangoDB (https://host:8529) instead of installing one on the instance; empty or "local"
      installs one here. Passwords never go through CloudFormation: put iter_data's user password in the
      SSM SecureString /iter/<stack>/arango-password and, only if that user or database does not exist
      yet, root's in /iter/<stack>/arango-root-password (aws/install.sh does this from ARANGO_PASSWORD and
      ARANGO_ROOT_PASSWORD); a PEM CA certificate goes in the String /iter/<stack>/arango-ca-cert.
  ArangoCertFingerprint:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(sha256:)?[0-9A-Fa-f:]{64,95}$'
    Description: >-
      With an https ArangoUrl serving a self-signed certificate: its fingerprint (sha256:<64 hex>), which
      iter_data pins. Leave empty for a certificate from a public CA or the CA in /iter/<stack>/arango-ca-cert.
  ArangoDb:
    Type: String
    Default: ""
    AllowedPattern: '^[A-Za-z0-9_-]*$'
    Description: iter_data's database in ArangoDB (empty = iter_db).
  ArangoUser:
    Type: String
    Default: ""
    AllowedPattern: '^[A-Za-z0-9_-]*$'
    Description: >-
      The ArangoDB user iter_data signs in as, with rw on its database only (empty = iter_user). Not root.
  ArangoAllowPlainHttp:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: >-
      "true" allows an http:// ArangoUrl on another machine (a private network you trust, e.g. inside the
      VPC); otherwise iter_data refuses plain http except to itself.
  LatestAmiArm64:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: The newest Amazon Linux 2023 AMI for arm64 (resolved by AWS; leave as is).
  LatestAmiX8664:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: The newest Amazon Linux 2023 AMI for x86_64 (resolved by AWS; leave as is).

Conditions:
  IsArm64: !Equals [!Ref Architecture, arm64]
  HasSsh: !Not [!Equals [!Ref SshCidr, ""]]
  HasKey: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "iter_data ${AWS::StackName}: the iter_data port only (ArangoDB is never exposed)"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref IterPort
          ToPort: !Ref IterPort
          CidrIp: !Ref AllowedCidr
          Description: iter_data API and web page
        - !If
          - HasSsh
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref SshCidr
            Description: SSH
          - !Ref AWS::NoValue
      Tags:
        - {Key: Name, Value: !Sub "iter-data-${AWS::StackName}"}

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        # also reads /iter/<stack>/arango-* (an external ArangoDB's passwords and CA certificate)
        - PolicyName: iter-admin-password-and-tls-fingerprint
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # PutParameter at first boot; DeleteParameter when the admin has chosen their
                # own password (iter-admin-cleanup removes /iter/<stack>/admin-password)
                Action: [ssm:PutParameter, ssm:GetParameter, ssm:DeleteParameter]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/iter/${AWS::StackName}/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !If [IsArm64, !Ref LatestAmiArm64, !Ref LatestAmiX8664]
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKey, !Ref KeyName, !Ref AWS::NoValue]
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags:
        - {Key: Name, Value: !Sub "iter-data-${AWS::StackName}"}
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            # First boot: mount the data volume, install iter_data from the release, store the
            # admin password (deleted again once the admin has chosen their own) and the TLS
            # certificate fingerprint in SSM, report to CloudFormation. Log: /var/log/iter-bootstrap.log
            set -euo pipefail
            exec > >(tee -a /var/log/iter-bootstrap.log) 2>&1
            SIGNAL_URL='${WaitHandle}'
            signal() {  # STATUS REASON
              local body
              body=$(printf '{"Status":"%s","Reason":"%s","UniqueId":"iter-data","Data":"%s"}' "$1" "$2" "$2")
              curl -fsS -X PUT -H 'Content-Type:' --data-binary "$body" "$SIGNAL_URL" || true
            }
            trap 'signal FAILURE "first boot failed at line $LINENO: see /var/log/iter-bootstrap.log"' ERR

            dnf install -y -q jq xfsprogs openssl

            # the data volume: the one disk with no partitions that is not the root disk
            root_disk="/dev/$(lsblk -no PKNAME "$(findmnt -no SOURCE /)")"
            dev=""
            for _ in $(seq 1 120); do
              for d in $(lsblk -dnpo NAME,TYPE | awk '$2=="disk"{print $1}'); do
                [ "$d" = "$root_disk" ] && continue
                [ "$(lsblk -no NAME "$d" | wc -l)" = 1 ] && { dev="$d"; break; }
              done
              [ -n "$dev" ] && break
              sleep 5
            done
            [ -n "$dev" ] || { echo "data volume never appeared"; false; }
            blkid "$dev" >/dev/null 2>&1 || mkfs.xfs -q -L iterdata "$dev"
            mkdir -p /data
            uuid=$(blkid -s UUID -o value "$dev")
            grep -q "$uuid" /etc/fstab || echo "UUID=$uuid /data xfs defaults,nofail 0 2" >> /etc/fstab
            mountpoint -q /data || mount /data

            # everything of iter_data goes in one folder on the data volume
            iterd='${IterDir}/iter_data'
            # tells iter-admin-cleanup (installed by linux_aws/install.sh) which SSM copy of
            # the first-boot admin password to delete once the admin has chosen their own
            mkdir -p "$iterd/config"
            printf 'STACK=%s\nREGION=%s\n' '${AWS::StackName}' '${AWS::Region}' > "$iterd/config/aws.env"
            chmod 644 "$iterd/config/aws.env"

            version='${IterVersion}'
            if [ "$version" = latest ]; then
              version=$(curl -fsSL --retry 5 https://api.github.com/repos/Stephen-Hilton/iter/releases/latest | jq -r .tag_name)
            fi
            [ -n "$version" ] && [ "$version" != null ] || { echo "no iter release found"; false; }

            # names on iter_data's self-signed certificate: the Elastic IP, and its public DNS
            # name once instance metadata (IMDSv2) shows the Elastic IP attached. Engines pin
            # the certificate's fingerprint and ignore names; the names are for browsers.
            eip='${ElasticIp}'
            tls_names="--tls-name $eip"
            for _ in $(seq 1 24); do
              tok=$(curl -fsS -m 5 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 300' http://169.254.169.254/latest/api/token || true)
              ip=$(curl -fsS -m 5 -H "X-aws-ec2-metadata-token: $tok" http://169.254.169.254/latest/meta-data/public-ipv4 || true)
              if [ "$ip" = "$eip" ]; then
                dns=$(curl -fsS -m 5 -H "X-aws-ec2-metadata-token: $tok" http://169.254.169.254/latest/meta-data/public-hostname || true)
                [ -z "$dns" ] || tls_names="$tls_names --tls-name $dns"
                break
              fi
              sleep 5
            done

            # ArangoDB elsewhere (ArangoUrl): its options, and its passwords and CA certificate
            # from SSM when they are there (aws/install.sh puts them). The passwords go through
            # an owner-only env file that is removed after the install (data.env keeps them).
            arango_opts=""
            envf=/root/iter-arango.env
            trap 'rm -f "$envf"' EXIT
            install -m 600 /dev/null "$envf"
            ssm_get() {  # NAME -> value, or nothing when the parameter does not exist
              aws ssm get-parameter --region '${AWS::Region}' --with-decryption --name "/iter/${AWS::StackName}/$1" \
                --query Parameter.Value --output text 2>/dev/null || true
            }
            arango_url='${ArangoUrl}' arango_fp='${ArangoCertFingerprint}' arango_db='${ArangoDb}'
            arango_user='${ArangoUser}' arango_plain='${ArangoAllowPlainHttp}'
            if [ -n "$arango_url" ] && [ "$arango_url" != local ]; then
              arango_opts="--arango-url $arango_url"
              [ -z "$arango_fp" ] || arango_opts="$arango_opts --arango-fingerprint $arango_fp"
              ca=$(ssm_get arango-ca-cert)
              if [ -n "$ca" ]; then
                printf '%s\n' "$ca" > /root/iter-arango-ca.pem
                arango_opts="$arango_opts --arango-ca-cert /root/iter-arango-ca.pem"
              fi
              [ "$arango_plain" != true ] || echo "ARANGO_ALLOW_PLAIN_HTTP=1" >> "$envf"
            fi
            [ -z "$arango_db" ] || arango_opts="$arango_opts --arango-db $arango_db"
            [ -z "$arango_user" ] || arango_opts="$arango_opts --arango-user $arango_user"
            v=$(ssm_get arango-password); [ -z "$v" ] || echo "ARANGO_PASSWORD=$v" >> "$envf"
            v=$(ssm_get arango-root-password); [ -z "$v" ] || echo "ARANGO_ROOT_PASSWORD=$v" >> "$envf"
            unset v
            env_opt=""; [ ! -s "$envf" ] || env_opt="--env-file $envf"

            echo "installing iter_data $version ($tls_names${!arango_opts:+ $arango_opts})"
            # shellcheck disable=SC2086  # tls_names, arango_opts and env_opt are several words on purpose
            curl -fsSL --retry 5 "https://raw.githubusercontent.com/Stephen-Hilton/iter/$version/installers/iter_data/linux_aws/install.sh" \
              | bash -s -- install --version "$version" --port ${IterPort} \
                  --iter-dir '${IterDir}' $tls_names $arango_opts $env_opt
            rm -f "$envf"

            pw=$(sed -n 's/^ITER_ADMIN_PASSWORD=//p' "$iterd/config/data.env" | head -1)
            [ -n "$pw" ] || { echo "no ITER_ADMIN_PASSWORD in $iterd/config/data.env"; false; }
            aws ssm put-parameter --region '${AWS::Region}' --name '/iter/${AWS::StackName}/admin-password' \
              --type SecureString --overwrite --value "$pw" >/dev/null
            unset pw

            # iter_data serves HTTPS with its self-signed certificate (-k: this only asks "up?")
            curl -fsSk "https://127.0.0.1:${IterPort}/health" | grep -q '"ok":true'

            # the certificate's fingerprint (SHA-256 of its DER), for engines to pin
            fp=$(openssl x509 -in "$iterd/state/tls.crt" -noout -fingerprint -sha256 | sed 's/.*=//; s/://g' | tr 'A-F' 'a-f')
            [ -n "$fp" ] || { echo "no TLS certificate at $iterd/state/tls.crt"; false; }
            aws ssm put-parameter --region '${AWS::Region}' --name '/iter/${AWS::StackName}/tls-fingerprint' \
              --type String --overwrite --value "sha256:$fp" >/dev/null
            echo "TLS certificate fingerprint: sha256:$fp"
            signal SUCCESS "iter_data $version is up, TLS certificate sha256:$fp"
          - {}

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !GetAtt Instance.AvailabilityZone
      Size: !Ref DataVolumeSize
      VolumeType: gp3
      Encrypted: true
      Tags:
        - {Key: Name, Value: !Sub "iter-data-${AWS::StackName}-db"}

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Instance
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

  # the address exists before the instance (its first boot puts it on the TLS certificate),
  # and is attached by the association below
  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: !Sub "iter-data-${AWS::StackName}"}

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  WaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  # the stack finishes only when first boot has installed iter_data and /health answers
  InstallFinished:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: [DataVolumeAttachment, ElasticIpAssociation]
    Properties:
      Handle: !Ref WaitHandle
      Timeout: "2700"
      Count: 1

Outputs:
  Url:
    Description: >-
      The iter web page and API (sign in as admin); engines use this as their iter_data URL. HTTPS
      with a certificate signed by iter_data's local CA: a browser trusts it once an engine is
      installed on its machine, or after opening <Url>/tls/ca.crt and trusting it as a CA.
    Value: !Sub "https://${ElasticIp}:${IterPort}"
  AdminPasswordParameter:
    Description: >-
      SSM Parameter Store name holding the first-boot admin password, until the admin has chosen
      their own at the first sign-in (the webui asks; 12+ characters): then the instance deletes it. Read it with:
      aws ssm get-parameter --with-decryption --name <this> --query Parameter.Value --output text
    Value: !Sub "/iter/${AWS::StackName}/admin-password"
  TlsFingerprintParameter:
    Description: >-
      SSM Parameter Store name holding iter_data's TLS certificate fingerprint (sha256:...), to give
      to each engine installer (--fingerprint) or compare with `iter_engine key status`. Read it with:
      aws ssm get-parameter --name <this> --query Parameter.Value --output text
    Value: !Sub "/iter/${AWS::StackName}/tls-fingerprint"
  InstanceId:
    Description: Connect with Session Manager (aws ssm start-session --target <this>).
    Value: !Ref Instance
  DataVolumeId:
    Description: The database volume (kept as a snapshot when the stack is deleted).
    Value: !Ref DataVolume
