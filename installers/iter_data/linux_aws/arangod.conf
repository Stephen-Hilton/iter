# ArangoDB for iter_data (install.sh renders @DB_DIR@): the docker image's config,
# but localhost only, so the Arango console is never reachable from outside.
# vector-index: GraphRAG's vector indexes (3.12.4+).
vector-index = true

[database]
directory = @DB_DIR@

[server]
endpoint = tcp://127.0.0.1:8529
authentication = true
statistics = true

[javascript]
startup-directory = /usr/share/arangodb3/js
app-path = @DB_DIR@-apps

[log]
level = info
file = -
