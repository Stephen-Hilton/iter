[package]
name = "iter_data"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "iter_data"
path = "src/main.rs"

[dependencies]
iter_core = { path = "../iter_core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pem"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tower = { version = "0.5.3", features = ["make", "util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
hyper = "1"

# musl's allocator makes the embedding model several times slower in the container
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
# tls.rs tests: a browser-style chain check of the local CA and its name constraints
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
