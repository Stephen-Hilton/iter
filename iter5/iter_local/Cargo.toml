[package]
name = "iter_local"
version = "0.1.0"
edition = "2024"
description = "The checkout side of iter5: node-file walking, the test runner, validate and iter migrate5"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
serde_yaml = "0.9"
base64 = "0.22"
iter_core = { path = "../iter_core" }
