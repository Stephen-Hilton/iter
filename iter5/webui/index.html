<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2026">
<title>iter5</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d2026'/%3E%3Cpath d='M9 22 L16 8 L23 22' fill='none' stroke='%234da3ff' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='22' r='2.5' fill='%2339c47f'/%3E%3C/svg%3E">
<style>
:root{--bg:#14161a;--panel:#1d2026;--line:#2c313a;--text:#d8dce3;--dim:#8b93a1;
--accent:#4da3ff;--ok:#39c47f;--warn:#e0b341;--bad:#e05252;--q:#b878e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}

/* ---- pinned top: brand row + counts/tools bar ---- */
#top{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line)}
#brandrow{display:flex;align-items:center;gap:8px 14px;padding:8px 18px;flex-wrap:wrap}
#brandrow>*{flex:none}
#brandrow .segwrap{flex:1 1 0;min-width:240px;justify-content:flex-end}
#brandrow .segwrap>.kv{flex:0 1 auto;min-width:0;text-align:right;line-height:1.35;font-size:11.5px}
#brandrow .segwrap>.seg{flex:none}
#brandrow h1{font-size:16px;margin:0;letter-spacing:.06em}
#brandrow .who{margin-left:auto;color:var(--dim)}
#brandrow #tz{max-width:170px;font-size:12px;padding:3px 6px}
#nav-toggle{display:none;font-size:16px;padding:2px 9px}
/* viewer role: read everything, change nothing (the API refuses anyway; this keeps the page honest) */
body.viewer .docbox,body.viewer #newitem,body.viewer .actbtn,body.viewer #doc-add,body.viewer #doc-text,body.viewer [data-test],body.viewer .wsubmit{display:none !important}
#counts{display:flex;gap:8px;align-items:center;padding:0 18px 10px;overflow-x:auto}
#counts .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.count{display:flex;align-items:baseline;gap:6px;padding:4px 12px;border:1px solid var(--line);
  border-radius:8px;cursor:pointer;white-space:nowrap;background:var(--bg);user-select:none}
.count b{font-size:16px;font-variant-numeric:tabular-nums}
.count span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.count.zero{opacity:.38}
.count.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
/* use-case progress row: pills under the counts bar (the demo tag's pill pinned first), wrapping on laptops and scrolling sideways on phones, each pill filled to its done/total share */
#ucrow{display:flex;gap:10px;align-items:center;padding:0 18px 10px}
#ucrow.empty{display:none}
#ucrow .uclabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);flex:none}
#ucchips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
/* depth ruler: one short tick per nesting level, hung under the header at the x where tiles of that depth start (--tick-x from JS, --tick-step 22px / 10px on phones) */
#depthticks{position:absolute;left:var(--tick-x,0px);bottom:-6px;height:6px;width:calc(var(--tick-n,0) * var(--tick-step,22px) + 1px);pointer-events:none;
  background:repeating-linear-gradient(90deg,#4b5261 0 1px,transparent 1px var(--tick-step,22px))}
#depthticks.hide{display:none}
.count.uc{padding:2px 10px;gap:7px;border-radius:6px;background-color:var(--bg)}
.count.uc b{font-size:13px}
.count.uc span{text-transform:none;letter-spacing:0;font-size:12px;color:var(--text)}
.count.uc span .ucprio{color:var(--dim);font-size:11px;margin-right:5px}
.count.uc.done b{color:var(--ok)}
.count.uc.sum{border-color:#4b5261}
.count.total b{color:var(--text)}
.count.c-in-progress b{color:#f2d24b}.count.c-queued b{color:var(--accent)}
#deadlocks .dl{margin:4px 0;padding:6px 10px;border-radius:6px;font-size:13px}
#deadlocks .dl.red{border:1px solid var(--bad);color:var(--bad)}
#deadlocks .dl.amber{border:1px solid var(--warn);color:var(--warn)}
#deadlocks a{color:inherit;font-family:monospace}
.count.mismatch{outline:1px solid var(--warn)}.count.mismatch b{color:var(--warn)}
.count.c-question b{color:var(--q)}.count.c-failed b{color:var(--bad)}
.count.c-complete b{color:#7fae8c}.count.c-parked b{color:#f0913a}.count.c-paused b{color:#d9772a}
.count.c-scheduled b{color:#9fd3e8}

/* ---- layout: left pane + main ---- */
/* one side panel beside every tab (2026-10-08); --top-h is the header's height, kept current by sizeTop() */
#layout{display:flex;align-items:flex-start;gap:0;min-height:calc(100vh - var(--top-h,90px))}
aside{width:var(--aside-w,240px);min-width:160px;max-width:60vw;flex:none;border-right:1px solid var(--line);padding:14px;position:sticky;top:var(--top-h,90px);
  max-height:calc(100vh - var(--top-h,90px));overflow-y:auto;transition:margin-left .18s ease-out}
#aside-grip{flex:none;width:6px;cursor:col-resize;align-self:stretch;position:sticky;top:var(--top-h,90px);max-height:calc(100vh - var(--top-h,90px));margin-left:-3px;z-index:2}
/* collapsed (per tab): the panel slides out left, a slim rail brings it back */
#aside-expand{display:none}
#aside-collapse{float:right;font-size:13px;padding:0 6px;margin-top:-2px}
body.aside-off aside{margin-left:calc(-1 * var(--aside-w,240px));visibility:hidden;transition:margin-left .18s ease-out,visibility 0s .18s}
body.aside-off #aside-grip{display:none}
body.aside-off #aside-expand{display:block;flex:none;position:sticky;top:var(--top-h,90px);height:calc(100vh - var(--top-h,90px));width:16px;padding:0;border:0;border-right:1px solid var(--line);border-radius:0;background:var(--panel);color:var(--dim);cursor:pointer;font-size:14px;line-height:1}
#aside-expand:hover{color:var(--accent);background:#20242b}
.gear.busy{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#aside-grip:hover,#aside-grip.dragging{background:var(--accent);opacity:.5}
body.resizing{cursor:col-resize;user-select:none}
main{flex:1;padding:14px 18px;min-width:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 8px}
.side-section{margin-bottom:22px}
.proj{display:block;width:100%;text-align:left;background:transparent;color:var(--text);
  border:1px solid transparent;border-radius:6px;padding:6px 9px;font:inherit;cursor:pointer}
.proj:hover{border-color:var(--line)}
.proj.sel{border-color:var(--accent);color:var(--accent)}
.proj .kv{display:block}
.eng{padding:6px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.eng:first-of-type{border-top:0}
.eng b{color:var(--text)}
.acct .hot{color:var(--bad)}
.acct .warm{color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}

button{background:var(--accent);color:#08121f;border:0;border-radius:6px;padding:7px 14px;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button.sm{padding:3px 9px;font-size:12px}
input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:inherit}
.kv{color:var(--dim);font-size:12px}
.kv b{color:var(--text)}

/* ---- workitem rows ---- */
#toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tile{border:1px solid var(--line);border-radius:6px;padding:7px 12px;margin:5px 0;display:flex;
  gap:10px;align-items:center;cursor:pointer}
.tile:hover{border-color:var(--accent)}
.tile .left{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.tile .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .right{display:flex;gap:12px;align-items:center;flex:none;color:var(--dim);font-size:12px}
.tile .id{font-family:ui-monospace,monospace;cursor:copy}
.tile .att{color:var(--warn);font-size:12px}
.tags{display:flex;gap:5px;flex:none}
.tagx{margin-left:5px;color:inherit;opacity:.7;text-decoration:none;font-weight:700}.tagx:hover{opacity:1}
.tag{font-size:11px;padding:1px 8px;border-radius:9px;font-weight:600;white-space:nowrap}
.state{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;text-transform:uppercase;flex:none}
.state.queued{background:#28405c;color:#9ec9ff}.state.in-progress{background:#274733;color:#7de0ae}
.state.complete{background:#243328;color:#7fae8c}.state.failed{background:#4b2626;color:#ff9b9b}
.state.question{background:#3c2a4d;color:#dbb3f7}.state.parked,.state.paused{background:#3a3a2c;color:#d9cf8e}
.state.scheduled{background:#2c3a44;color:#9fd3e8}
.prio{font-weight:700;font-size:12px;color:var(--dim);flex:none;font-variant-numeric:tabular-nums}
.agent{font-size:12px;color:var(--dim);flex:none}
.tile[data-depth]{border-left:2px solid var(--line)}
.tile[data-depth="0"]{border-left:1px solid var(--line)}
@keyframes flashbg{0%{background:#2b4a72;border-color:var(--accent)}100%{background:transparent;border-color:var(--line)}}
.flash{animation:flashbg 1.8s ease-out}

/* ---- project state control (aspirational; engines follow it) ---- */
.segwrap{margin-left:auto;display:flex;align-items:center;gap:8px}
.segwrap .kv b{font-weight:600}
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-top:6px}
.mstats span{display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.mstats i{font-style:normal;width:14px;text-align:center;color:var(--dim);flex:none}
.mstats b{margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums}
.pstat{display:inline-flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:2px 12px;font-size:12px;color:var(--dim);white-space:nowrap;min-width:0}
.pstat .ps-eng{display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.pstat .ps-eng i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.pstat .ps-eng.bad{color:#ff9b9b}.pstat .ps-eng.bad i{background:var(--bad)}
.pstat .ps-g{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.pstat .engsetup{font-size:11.5px;padding:1px 9px;border-radius:6px;font-weight:600;background:transparent;color:#ffb38a;border:1px solid #7a3d1d;line-height:1.5}
.pstat .engsetup:hover{background:#2b1a10}
@media (max-width:1700px){#brandrow #backend{display:none}}
@media (max-width:1280px){.pstat span[title^="spend"]{display:none}}
#logout{border-color:var(--line);color:var(--dim)}#logout:hover{color:var(--text);border-color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:var(--dim);border:0;border-radius:0;padding:4px 11px;font-size:12px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.Running{background:#274733;color:#7de0ae}
.seg button.on.Draining{background:#4a3f1e;color:#f0c75e}
.seg button.on.Stopped{background:#4b2626;color:#ff9b9b}
.seg button:disabled{cursor:default}
/* on/off switches in the left pane (server, projects, engines, accounts) */
.seg.sw{border-radius:6px;vertical-align:middle;flex:none}
.seg.sw button{padding:1px 7px;font-size:11px}
.swrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:3px 0 1px}
.swnote{font-size:11px;color:#f0c75e}
.pstat .ps-off{color:#ff9b9b;font-weight:600}
#brandrow .who{margin-left:0}
@media (max-width:760px){
  .segwrap{margin-left:0;width:100%;order:9;justify-content:space-between;flex-wrap:wrap;row-gap:6px}
  .segwrap .seg{flex:none}
  #brandrow{flex-wrap:wrap;row-gap:6px}
  #brandrow .who{margin-left:auto}
}

/* ---- settings gears + forms ---- */
.gear{background:transparent;color:var(--dim);border:1px solid transparent;border-radius:6px;padding:2px 6px;font-size:14px;line-height:1;cursor:pointer}
.gear:hover{color:var(--accent);border-color:var(--line)}
.projrow{display:flex;align-items:center;gap:4px}
.projrow .proj{flex:1;min-width:0}
.projnote{margin:-2px 0 6px 10px}
.eng .gear{float:right}
.eng.compact{padding:3px 4px;font-size:12px}
.eng.compact .gear{float:none;padding:1px 5px;margin-right:4px}
.sf .frow textarea{font-family:ui-monospace,monospace;font-size:12px}
.sf .help{color:var(--dim);font-size:11px;margin-top:2px}
.sf .ro{color:var(--dim);padding-top:7px;font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
.sf h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:18px 0 6px;border-top:1px solid var(--line);padding-top:12px}
.sf .list button{margin:2px 4px 2px 0}
.sf .fieldbad{border-color:var(--bad) !important}
@media (max-width:760px){.projrow .gear{padding:4px 8px}}

/* ---- actions menu ---- */
.actmenu[hidden]{display:none}   /* the class's display:flex must not beat [hidden] */
.actmenu{position:fixed;z-index:200;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:6px;min-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:2px}
.actmenu button{background:transparent;color:var(--text);text-align:left;border:0;padding:7px 10px;border-radius:5px;font-weight:500}
.actmenu button:hover{background:var(--bg)}
.actmenu button.danger{color:var(--bad)}
.actmenu .sep{border-top:1px solid var(--line);margin:4px 0}
.actmenu .note{font-size:11px;color:var(--dim);padding:4px 10px;max-width:300px;white-space:normal}

#login{max-width:340px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
#login input{width:100%;margin-bottom:10px}
.err{color:var(--bad);min-height:20px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;max-width:1100px;width:92%}
#tagpick{max-width:520px}
dialog::backdrop{background:rgba(0,0,0,.55)}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:480px;overflow:auto}
.wfield{margin:10px 0}
.wfield label{display:block;color:var(--dim);margin-bottom:4px}
.frow{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;align-items:start;margin:8px 0}
.frow[hidden]{display:none}   /* the grid must not beat [hidden] (exec shell, schedule rows) */
.frow label{color:var(--dim);padding-top:7px}
.frow input,.frow select,.frow textarea{width:100%}
.dlghead{display:flex;align-items:center;gap:10px}
/* detail lightbox: the head + id/meta rows stay pinned while the details scroll */
#detail{padding:0}
.dlgtop{position:sticky;top:0;z-index:5;background:var(--panel);padding:16px 16px 8px;border-bottom:1px solid var(--line)}
.dlgbody{padding:8px 16px 16px}
.dlghead h2{flex:1;font-size:15px;color:var(--text);text-transform:none;letter-spacing:0;margin:0}
details.v2>summary{cursor:pointer;color:var(--dim);font-size:12px;margin-top:14px}
details.dbox>summary{cursor:pointer;margin-top:14px;display:list-item}
details.dbox>summary h2{display:inline;margin:0}
details.dbox>summary .peek{display:block;color:var(--dim);font-size:12px;margin:2px 0 0 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.dbox[open]>summary .peek{display:none}
a{color:var(--accent)}

/* ---- phones: stack everything vertically (laptops keep the wide layout) ---- */
@media (max-width: 760px){
  body{font-size:15px}
  #brandrow{padding:8px 12px;gap:10px}
  #brandrow .who{font-size:12px}
  #brandrow #tz{max-width:118px}
  .pstat{flex-wrap:wrap;justify-content:flex-start}
  #counts{flex-wrap:wrap;padding:0 12px 6px;overflow:visible;row-gap:6px}
  #chips{flex-wrap:nowrap;gap:6px;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .count{padding:2px 8px;gap:4px;flex:none}
  .count b{font-size:13px}
  .count span{font-size:10px}
  #counts .tools{margin-left:0;width:100%;justify-content:space-between}
  #counts .tools button{padding:5px 10px;font-size:13px}
  #counts .tools select{max-width:140px;padding:4px 6px;font-size:13px}
  #ucrow{padding:0 12px 6px;gap:6px;min-width:0}
  #ucrow .uclabel{display:none}
  #ucchips{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  #ucchips::-webkit-scrollbar{display:none}
  .count.uc{padding:1px 7px;gap:5px;flex:none}
  #depthticks{--tick-step:10px}
  #brandrow button{padding:4px 10px;font-size:13px}
  #layout{display:block !important;min-height:0}
  #aside-grip{display:none}
  /* phones: the drawer below replaces collapsing */
  #aside-expand,#aside-collapse{display:none !important}
  body.aside-off aside{margin-left:0;visibility:visible}
  /* left nav: an off-canvas drawer (hidden by default; ☰ in the header opens it) */
  aside{position:fixed;top:0;left:0;bottom:0;z-index:300;width:min(84vw,320px);max-width:none;max-height:none;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));border-right:1px solid var(--line);background:var(--panel);
    overflow-y:auto;transform:translateX(-102%);transition:transform .18s ease-out;box-shadow:0 0 24px rgba(0,0,0,.5)}
  body.nav-open aside{transform:none}
  #aside-backdrop{display:none;position:fixed;inset:0;z-index:299;background:rgba(0,0,0,.5)}
  body.nav-open #aside-backdrop{display:block}
  #nav-toggle{display:inline-block}
  main{padding:10px 12px}
  #viewnote{display:block;width:100%}
  /* rows: name on top, meta strip below */
  .tile{flex-wrap:wrap;gap:6px 8px;padding:8px 10px;cursor:default}
  .tile .left{flex:1 1 100%;flex-wrap:wrap;gap:6px 8px;align-items:center}
  .tile .nm{white-space:normal;flex:1 1 100%;order:9;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tile .right{flex:1 1 100%;justify-content:flex-start;flex-wrap:wrap;gap:6px 10px}
  .tile .right .actbtn{margin-left:auto}
  .tags{flex-wrap:wrap}
  .tile[data-depth]{margin-left:calc(var(--d,0) * 10px) !important}
  /* dialogs: full screen sheets */
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border:0;border-radius:0;overflow-y:auto}
  dialog>div{padding:12px !important}
  .dlgtop{padding:12px 12px 6px !important}
  .dlghead{flex-wrap:wrap}
  .dlghead h2{flex:1 1 100%;order:-1}
  .frow{grid-template-columns:1fr;gap:3px 0}
  .frow label{padding-top:0;font-size:12px}
  pre{max-height:none;font-size:13px}
  /* actions menu: bottom sheet */
  .actmenu{left:0 !important;right:0;top:auto !important;bottom:0;width:100vw;min-width:0;border-radius:12px 12px 0 0;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));max-height:70vh;overflow-y:auto}
  .actmenu button{padding:11px 12px;font-size:15px}
  .actmenu .note{max-width:none}
  button{padding:8px 12px}
  #login{margin:8vh 14px}
}
/* iter5 tabs: one header for Intro | Work queue | Project graph | GraphRAG | Settings */
#tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;max-width:100%}
#tabs button{font:inherit;font-size:13px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--dim);padding:5px 12px;cursor:pointer;font-weight:500;border-radius:0;white-space:nowrap}
#tabs button:last-child{border-right:0}
#tabs button.on{background:var(--accent);color:#0b1220;font-weight:600}
#tabs button:hover:not(.on){background:#262a31;color:var(--text)}
#brandrow h1 sup{font-size:10px;color:var(--accent);margin-left:2px;letter-spacing:0}
#projpick{font-size:13px;padding:3px 6px;max-width:200px;font-weight:600}
#helpbtn{width:28px;padding:2px 0;text-align:center;font-weight:700}
body.tab-graph #counts,body.tab-graph #ucrow,body.tab-graph #depthticks,body.tab-intro #counts,body.tab-intro #ucrow,body.tab-intro #depthticks,
body.tab-settings #counts,body.tab-settings #ucrow,body.tab-settings #depthticks,body.tab-settings #projctl,body.tab-settings #projpick{display:none !important}
#tab-graph,#tab-settings{display:none}
body.tab-graph #tab-graph,body.tab-settings #tab-settings{display:flex}
#tab-intro{display:none}
body.tab-intro #tab-intro{display:block}
body.tab-graph main,body.tab-intro main,body.tab-settings main,body.tab-rag main{display:none !important}
#tab-intro,#tab-rag{flex:1;min-width:0}

<script>
"use strict";
const $=s=>document.querySelector(s);
let sgCache=null;
/* every settings record (project, engine, agent, tooling, user, account) has a stable id — its key in every URL,
   edge and work item — and a display name that can be renamed: rid() for keys, rname() for what people read */
const rid=r=>r?String(r.id||r.user||r.name||""):"";
const rname=r=>r?String(r.name||rid(r)):"";
/* the display name of the <type> record with this id (settings graph, then the loaded lists); the id when unknown */
function nameOf(type,id){
  if(id==null||id==="")return "";
  const n=sgCache&&Array.isArray(sgCache.nodes)?sgCache.nodes.find(x=>x.id===type+":"+id):null;
  if(n&&n.name)return n.name;
  const list={project:projectsCache,iter_engine:enginesCache,agent:agentsCache}[type]||[];
  const r=list.find(x=>rid(x)===id);
  return r?rname(r):String(id);
}
/* the projects an engine serves: active serves edges in the settings graph; iter4-shaped engine records as a fallback */
function servesOf(e){
  if(sgCache&&Array.isArray(sgCache.edges))return sgCache.edges.filter(x=>x.type==="serves"&&x.from==="iter_engine:"+rid(e)&&x.active!==false).map(x=>String(x.to).replace(/^project:/,""));
  return Object.keys(e.projects||{});
}
async function openSettingsGraph(id){await setTab("settings");if(id&&window.IterSettings)setTimeout(()=>IterSettings.focus(id),60);}
let token=null,me=null,myRole="",project=null,itemsCache=[],agentsCache=[],projectsCache=[],enginesCache=[],dlgDirty=false;
const filters=new Set();   // additive state filters from the pinned counts bar
const STATES=["in-progress","queued","question","parked","paused","failed","complete","scheduled"];
const CLOSED=new Set(["complete","failed"]); // immutable except appended "doc" rows + reopen
const ALL_STATES=["queued","in-progress","question","parked","paused","scheduled","complete","failed"]; // Actions -> Change to…
const UC_PREFIX="usecase:", UC_COLOR="#3b6fb6", PRIO_DEFAULT=40; // priority 0–99 (decided 2026-09-08)
const BLOCKED_PREFIX="blocked by: "; // engine-owned wait tag (iter_core BLOCKED_TAG_PREFIX); derived, never edited here
let ucFilter=""; // one chip key: a usecase name or a summary tag, or ""
const ucOf=i=>(i.tags||[]).filter(t=>t&&t.text&&t.text.startsWith(UC_PREFIX)).map(t=>t.text.slice(UC_PREFIX.length));
const SUMMARY_TAGS=["demo"]; // plain tags that also get a pinned progress chip, ahead of the use cases (Stephen 2026-09-22)
const chipKeysOf=i=>[...SUMMARY_TAGS.filter(s=>(i.tags||[]).some(t=>t&&t.text===s)),...ucOf(i)]; // the keys a chip can filter on
const chipLabel=k=>SUMMARY_TAGS.includes(k)?"tag "+k:"usecase "+k;
const OPEN_TARGETS=["queued","parked","paused","question"];
const TAG_PALETTE=["#4da3ff","#39c47f","#e0b341","#b878e6","#e07a52","#4dd0c4","#e05252","#9fd3e8"];

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{"content-type":"application/json",
    ...(token?{authorization:"Bearer "+token}:{}),...(opts.headers||{})}});
  const body=await r.json().catch(()=>null);
  if(!r.ok)throw Object.assign(new Error((body&&body.error)||r.status),{status:r.status,body});
  return body;
}
function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
/* ---- timezone: everything is stored in UTC; the webui renders in the user's zone ---- */
const TZ_CHOICES=[["","browser default"],["UTC","UTC"],
  ["Pacific/Honolulu","Honolulu (HST)"],["America/Anchorage","Anchorage (AKT)"],["America/Los_Angeles","Los Angeles (PT)"],["America/Denver","Denver (MT)"],["America/Phoenix","Phoenix (MST)"],["America/Chicago","Chicago (CT)"],["America/New_York","New York (ET)"],["America/Toronto","Toronto (ET)"],["America/Mexico_City","Mexico City"],["America/Bogota","Bogotá"],["America/Lima","Lima"],["America/Santiago","Santiago"],["America/Sao_Paulo","São Paulo"],["America/Argentina/Buenos_Aires","Buenos Aires"],
  ["Europe/London","London (GMT/BST)"],["Europe/Dublin","Dublin"],["Europe/Lisbon","Lisbon"],["Europe/Paris","Paris (CET)"],["Europe/Berlin","Berlin (CET)"],["Europe/Madrid","Madrid"],["Europe/Rome","Rome"],["Europe/Amsterdam","Amsterdam"],["Europe/Zurich","Zurich"],["Europe/Stockholm","Stockholm"],["Europe/Warsaw","Warsaw"],["Europe/Athens","Athens (EET)"],["Europe/Istanbul","Istanbul"],["Europe/Moscow","Moscow"],
  ["Africa/Cairo","Cairo"],["Africa/Johannesburg","Johannesburg"],["Africa/Lagos","Lagos"],["Africa/Nairobi","Nairobi"],
  ["Asia/Dubai","Dubai (GST)"],["Asia/Riyadh","Riyadh (AST)"],["Asia/Tehran","Tehran"],["Asia/Karachi","Karachi"],["Asia/Kolkata","India (IST)"],["Asia/Dhaka","Dhaka"],["Asia/Bangkok","Bangkok"],["Asia/Jakarta","Jakarta"],["Asia/Singapore","Singapore"],["Asia/Hong_Kong","Hong Kong"],["Asia/Shanghai","Shanghai (CST)"],["Asia/Taipei","Taipei"],["Asia/Manila","Manila"],["Asia/Seoul","Seoul (KST)"],["Asia/Tokyo","Tokyo (JST)"],
  ["Australia/Perth","Perth (AWST)"],["Australia/Adelaide","Adelaide"],["Australia/Brisbane","Brisbane"],["Australia/Sydney","Sydney (AEST)"],["Australia/Melbourne","Melbourne"],["Pacific/Auckland","Auckland (NZST)"]];
let userTz="";
function tzValid(tz){try{new Intl.DateTimeFormat("en-US",{timeZone:tz});return true;}catch(e){return false;}}
function setTz(tz){userTz=tzValid(tz)?tz:"";try{if(userTz)localStorage.setItem("iter5.tz",userTz);else localStorage.removeItem("iter5.tz");}catch(e){}
  const sel=$("#tz");if(sel){sel.innerHTML=TZ_CHOICES.map(([v,l])=>`<option value="${esc(v)}" ${v===userTz?"selected":""}>${esc(l)}</option>`).join("");}}
const tzParts=(()=>{const cache={};return d=>{const key=userTz||"_";
  if(!cache[key])cache[key]=new Intl.DateTimeFormat("en-US",{...(userTz?{timeZone:userTz}:{}),month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false,timeZoneName:"short"});
  const o={};cache[key].formatToParts(d).forEach(p=>{o[p.type]=p.value;});return o;};})();
/* "MM-DD HH:mm" in the user's zone (ISO/UTC in, never shown raw) */
function fmtTs(iso){
  if(!iso)return "";
  const d=new Date(iso);
  if(isNaN(d))return "";
  const o=tzParts(d);
  return `${o.month}-${o.day} ${o.hour==="24"?"00":o.hour}:${o.minute}`;
}
function tzAbbrev(){return tzParts(new Date()).timeZoneName||"";}
/* time until a unix-seconds instant: "2hr 23min", "3d 18hr 30min"; past -> "resetting…" */
function fmtDur(epochSec){
  if(!epochSec)return "—";
  let s=Math.round(epochSec-Date.now()/1000);
  if(s<=0)return "resetting…";
  const d=Math.floor(s/86400);s-=d*86400;const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60);
  return (d?`${d}d `:"")+(d||h?`${h}hr `:"")+`${m}min`;
}
const P=name=>`/api/projects/${encodeURIComponent(project)}/workitems${name?"/"+name:""}`;
function tagColor(t){
  if(t.color&&/^#[0-9a-f]{3,8}$/i.test(t.color))return t.color;
  let h=0;for(const c of (t.text||""))h=(h*31+c.charCodeAt(0))>>>0;
  return TAG_PALETTE[h%TAG_PALETTE.length];
}
function tagFg(hex){
  const h=hex.replace("#","");const n=h.length===3?h.split("").map(c=>c+c).join(""):h.slice(0,6);
  const r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16);
  return (r*299+g*587+b*114)/1000>150?"#0b0d11":"#f3f5f8";
}
/* a lockdir at the repo root drains every other agent before this item can start */
function fullTreeLock(i){return (i.lockdirs||[]).some(d=>String(d).replace(/\/+$/,"")==="{topdir}");}
/* a wide lock (2026-09-07): a lockdir that is a strict ancestor of other OPEN items'
   lockdirs locks an area, not the directory one item writes — they all wait while it
   runs.  Returns the number of other open items it covers (0/1 = nothing to say). */
const norm=d=>String(d||"").replace(/\/+$/,"");
function isStrictAncestor(a,b){a=norm(a);b=norm(b);return a!==b&&b.startsWith(a+"/");}
function wideLockCount(i){
  if(CLOSED.has(i.state))return 0;
  const mine=(i.lockdirs||[]).map(norm).filter(Boolean);
  if(!mine.length)return 0;
  let n=0;
  for(const o of itemsCache){
    if(o.id===i.id||CLOSED.has(o.state)||o.state==="scheduled")continue;
    if((o.lockdirs||[]).some(d=>mine.some(m=>isStrictAncestor(m,d))))n++;
  }
  return n;
}
/* the other open items whose lockdirs sit strictly under one lockdir of i —
   what makes that lockdir a wide lock; shown per dir in the lightbox */
function lockdirCoverage(i,d){
  if(CLOSED.has(i.state))return [];
  return itemsCache.filter(o=>o.id!==i.id&&!CLOSED.has(o.state)&&o.state!=="scheduled"&&
    (o.lockdirs||[]).some(x=>isStrictAncestor(d,x))).map(o=>o.id);
}
function tagsHtml(i,removable){
  const tags=(i.tags||[]).filter(t=>t&&t.text).map(t=>({...t,own:!t.text.startsWith(BLOCKED_PREFIX)}));
  const wide=fullTreeLock(i)?0:wideLockCount(i);
  if(wide>=2)tags.unshift({text:`wide lock (${wide} items)`,color:"#e05252"});
  if(fullTreeLock(i)&&!CLOSED.has(i.state))tags.unshift({text:"full tree lock",color:"#e05252"});
  if(!tags.length)return "";
  /* removable (lightbox only): a × on every tag that is really on the row — the engine's
     derived "blocked by: …" and the synthesized lock tags are not on it, so they get none */
  return `<span class="tags">${tags.map(t=>{const c=tagColor(t);const x=removable&&t.own?`<a href="#" class="tagx" data-rmtag="${esc(t.text)}" title="remove this tag (a tags-only change; allowed on closed items)">×</a>`:"";
    return `<span class="tag" style="background:${esc(c)};color:${tagFg(c)}">${esc(t.text)}${x}</span>`;}).join("")}</span>`;
}

async function boot(){
  try{const h=await fetch("/health").then(r=>r.json());$("#backend").textContent="data: "+h.backend;}catch(e){}
  try{setTz(localStorage.getItem("iter5.tz")||"");}catch(e){}
  try{const w=parseInt(localStorage.getItem("iter5.aside_w"));if(w>=160)document.documentElement.style.setProperty("--aside-w",w+"px");}catch(e){}
  (()=>{const nav=v=>document.body.classList.toggle("nav-open",v);
    $("#nav-toggle").onclick=()=>nav(!document.body.classList.contains("nav-open"));
    $("#aside-backdrop").onclick=()=>nav(false);
    document.querySelector("aside").addEventListener("click",e=>{if(e.target.closest(".proj"))nav(false);});
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("nav-open"))nav(false);});})();
  (()=>{const grip=$("#aside-grip"),aside=document.querySelector("aside");if(!grip||!aside)return;
    grip.onpointerdown=e=>{e.preventDefault();grip.setPointerCapture(e.pointerId);grip.classList.add("dragging");document.body.classList.add("resizing");
      const x0=e.clientX,w0=aside.getBoundingClientRect().width;
      grip.onpointermove=ev=>{const w=Math.max(160,Math.min(window.innerWidth*0.6,w0+ev.clientX-x0));document.documentElement.style.setProperty("--aside-w",w+"px");placeDepthTicks(lastMaxDepth);};
      grip.onpointerup=grip.onpointercancel=()=>{grip.onpointermove=null;grip.classList.remove("dragging");document.body.classList.remove("resizing");
        try{localStorage.setItem("iter5.aside_w",String(Math.round(aside.getBoundingClientRect().width)));}catch(e){}resizeViews();};};
    grip.ondblclick=()=>{document.documentElement.style.removeProperty("--aside-w");try{localStorage.removeItem("iter5.aside_w");}catch(e){}resizeViews();};})();
  try{token=localStorage.getItem("iter5.token");me=localStorage.getItem("iter5.user");myRole=localStorage.getItem("iter5.role")||"";
      const s=localStorage.getItem("iter5.sort");if(s)$("#sort").value=s;}catch(e){}
  if(token){try{await load();return;}catch(e){token=null;}}
  $("#login").style.display="";$("#layout").style.display="none";$("#top").style.display="none";
}
$("#li-go").onclick=async()=>{
  try{
    const r=await api("/auth/login",{method:"POST",body:JSON.stringify({user:$("#li-user").value,password:$("#li-pass").value})});
    token=r.token;me=r.user;myRole=r.role||"";
    try{localStorage.setItem("iter5.token",token);localStorage.setItem("iter5.user",me);localStorage.setItem("iter5.role",myRole);}catch(e){}
    if(typeof r.timezone==="string"&&r.timezone)setTz(r.timezone);
    await load();
  }catch(e){$("#li-err").textContent="login failed";}
};
$("#li-pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("#li-go").click();});
$("#logout").onclick=()=>{token=null;try{localStorage.removeItem("iter5.token");}catch(e){};location.reload();};
$("#refresh").onclick=()=>project&&loadItems(project);
$("#sort").onchange=()=>{try{localStorage.setItem("iter5.sort",$("#sort").value);}catch(e){};renderItems();};
$("#newitem").onclick=()=>openForm("create",null);
$("#user-gear").onclick=()=>openSettings("user",me);
$("#engine-add").onclick=async()=>{
  /* iter5: an engine registers itself on first start (iter_engine --data-url URL --env-file PATH);
     adding one by hand, and connecting it to projects and accounts, happens in the settings graph */
  await setTab("settings");
  if(window.IterSettings)IterSettings.newNode("iter_engine");
};
$("#helpbtn").onclick=()=>openPageHelp();
/* phones: the ⋯ menu holds user, timezone, help, my settings and logout; any click outside it (or a pick inside) closes it */
const setHdrMore=open=>{document.body.classList.toggle("hdrmore-open",open);$("#hdrmore-btn").setAttribute("aria-expanded",open?"true":"false");};
$("#hdrmore-btn").onclick=ev=>{ev.stopPropagation();setHdrMore(!document.body.classList.contains("hdrmore-open"));};
document.addEventListener("click",ev=>{

/* shared by the engine block and the Accounts section: a unix-seconds instant as local time, a percentage, one account's full tooltip */
const at=s=>s?`${fmtTs(new Date(s*1000).toISOString())} ${tzAbbrev()}`:"";
const pct=v=>v==null?"—":Math.round(v)+"%";
/* an account's stop% is its bills edge's setting for the selected project (the engine's report carries usage only) */
const stopOf=n=>{const e=((sgCache&&sgCache.edges)||[]).find(x=>x.type==="bills"&&x.from==="account:"+n&&x.to==="project:"+project);const s=e&&e.settings?e.settings.stop:null;return typeof s==="number"?s:null;};
const acctTitle=a=>`${nameOf("account",a.name)}: 5h ${pct(a.five_hour_pct)} resets ${at(a.five_hour_resets_at)||"?"} · 7d ${pct(a.seven_day_pct)} resets ${at(a.seven_day_resets_at)||"?"}${stopOf(a.name)==null?"":` · stop ${stopOf(a.name)}%`}`
  +(a.is_using_overage?" · OVERAGE":"")+(a.in_use?" · held by another engine":"")+(a.available_at?` · available ${at(a.available_at)}`:" · no estimate")
  +(a.token==="unset"?" · NO TOKEN in the engine's env_file":"");

/* ---- on/off switches (2026-10-08): the server, each project, each engine and each account is
   Active or Stopped. Stopped starts nothing new; work already running finishes. A project's switch
   is its state (Running | Draining | Stopped); the others are `active` on their own records, set
   with POST /api/switch (the server and accounts by an admin, an engine also by its owner). ---- */
let serverRow={active:true};
const swOn=r=>!(r&&r.active===false);
function swHtml(target,on,can,label){
  return `<span class="seg sw" data-sw="${esc(target)}" data-label="${esc(label)}" title="${esc(label)}: ${on?"Active":"Stopped — nothing new starts"}${can?"":" (an admin switches it)"}">`
    +`<button class="Running ${on?"on":""}" data-on="1"${on||!can?" disabled":""}>Active</button>`
    +`<button class="Stopped ${on?"":"on"}" data-on="0"${!on||!can?" disabled":""}>Stopped</button></span>`;
}
function projSwHtml(p,can){
  const st=p.state||"Running",pid=esc(rid(p)),d=can?"":" disabled";
  if(st==="Draining")return `<span class="seg sw" data-psw="${pid}"><button class="Draining on" disabled title="finishing running work; Stopped once drained">Stopping…</button>`
    +`<button class="Running" data-st="Running"${d}>Active</button><button class="Stopped" data-st="Stopped"${d} title="stop now without waiting for running work">force</button></span>`;
  const on=st==="Running";
  return `<span class="seg sw" data-psw="${pid}" title="${esc(rname(p))}: ${on?"Active":"Stopped — nothing new starts"}">`
    +`<button class="Running ${on?"on":""}" data-st="Running"${on||!can?" disabled":""}>Active</button>`
    +`<button class="Stopped ${on?"":"on"}" data-st="Stopped"${!on||!can?" disabled":""}>Stopped</button></span>`;
}
async function flipSwitch(target,on,label){
  if(!confirm(on?`Switch ${label} to Active?\nNew work may start again.`:`Switch ${label} to Stopped?\nNothing new starts; work already running finishes.`))return;
  try{await api("/api/switch",{method:"POST",body:JSON.stringify({target,active:on})});await load();}
  catch(e){alert("could not switch: "+e.message);}
}
/* a project Stopped while work runs drains first (Draining), then settles to Stopped */
async function flipProject(p,target){
  const pp="/api/projects/"+encodeURIComponent(p);
  try{
    const fresh=await api(pp),st=fresh.state;
    let msg=target==="Running"?"Engines start picking queued work for this project.":"Engines finish what is running and start nothing new; the project shows Stopped once drained.";
    if(target==="Stopped"&&st==="Running"){const s=await api(pp+"/status").catch(()=>null);if(s&&s.inprogress>0)target="Draining";}
    if(target==="Stopped"&&st==="Draining")msg="Stop immediately without waiting for running work to finish (it keeps running on the engine until its turn ends).";
    if(!confirm(`${target==="Running"?"Activate":"Stop"} ${nameOf("project",p)}?\n${msg}`))return;
    fresh.state=target;
    await api(pp,{method:"PUT",body:JSON.stringify(fresh)});
    await load();
  }catch(e){alert("could not change state: "+e.message);}
}
function wireSwitches(root){
  root.querySelectorAll(".sw[data-sw] button[data-on]").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();const sw=b.closest(".sw");flipSwitch(sw.dataset.sw,b.dataset.on==="1",sw.dataset.label);});
  root.querySelectorAll(".sw[data-psw] button[data-st]").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();flipProject(b.closest(".sw").dataset.psw,b.dataset.st);});
}
/* why a project with its own switch Active still starts nothing: the server switch, no engine
   serving it, or every engine serving it switched off ("" = nothing in the way) */
function projBlock(p){
  if(!swOn(serverRow))return "server is Stopped";
  const pid="project:"+rid(p);
  const serving=((sgCache&&sgCache.edges)||[]).filter(e=>e.type==="serves"&&e.active!==false&&e.to===pid).map(e=>e.from.replace(/^iter_engine:/,""));
  if(!serving.length)return "no engine serves it";
  const engs=serving.map(id=>enginesCache.find(e=>rid(e)===id)).filter(Boolean);
  if(engs.length&&engs.every(e=>!swOn(e)))return "its engine"+(engs.length>1?"s are":" is")+" Stopped";
  return "";
}
const holdText=h=>h==="no account token"?"no account token":h==="accounts switched off"?"accounts switched off":"no usage left";
/* one row per account that bills the selected project (an active bills edge); the engine with the newest last_seen owns the snapshot */
function renderAccounts(engines){
  if(!project){$("#accounts").innerHTML="<div class='eng kv'>no project selected</div>";return;}
  const billed=new Set(((sgCache&&sgCache.edges)||[])
    .filter(e=>e.type==="bills"&&e.active!==false&&e.to==="project:"+project)
    .map(e=>e.from.replace(/^account:/,"")));
  const now=Date.now();
  const seenOf=e=>e.last_seen?Date.parse(e.last_seen):0;
  const alive=e=>{const s=seenOf(e);return !!s&&(now-s)<3*(e.ticksec||5)*1000+5000;};
  const best={};
  (engines||[]).forEach(e=>{(Array.isArray(e.accounts)?e.accounts:[]).forEach(a=>{
    if(!a||a.name==null||!billed.has(a.name))return;
    const cur=best[a.name];
    if(!cur||seenOf(e)>seenOf(cur.e))best[a.name]={a:a,e:e};
  });});
  const usedBy={};   // account id -> the live engine currently running on it (its display name)
  (engines||[]).forEach(e=>{
    const n=e.usage&&e.usage.account!=null?e.usage.account:e.account;
    if(n!=null&&alive(e)&&usedBy[n]==null)usedBy[n]=rname(e);
  });
  const win=(label,a,v,reset)=>{
    const s=stopOf(a.name);const stop=s==null?99:s;
    const cls=v==null?"":(v>=stop?' class="hot"':(v>=stop-20?' class="warm"':""));
    return `<br>• ${label} <b${cls}>${esc(pct(v))}</b>`
      +(v==null?"":` – <span title="resets ${esc(at(reset))}">${esc(fmtDur(reset))}</span>`);
  };
  const names=Object.keys(best).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const acctNode=n=>((sgCache&&sgCache.nodes)||[]).find(x=>x.id==="account:"+n);
  const acctSw=n=>{const node=acctNode(n);return `<div class="swrow">${swHtml("account:"+n,swOn(node&&node.settings),isAdmin(),"account "+nameOf("account",n))}</div>`;};
  $("#accounts").innerHTML=names.map(n=>{
    const a=best[n].a,src=best[n].e;
    const status=a.token==="unset"?"⚠ no token":(usedBy[n]?"· in use by "+esc(usedBy[n]):"· idle");
    return `<div class="eng acct" title="${esc(acctTitle(a)+" · reported by "+rname(src))}"><b>${esc(nameOf("account",n))}</b> <a class="sgl" data-sgraph="account:${esc(n)}" title="this account in the settings graph">↗</a> <span class="kv">${status}</span>`
      +acctSw(n)
      +(win("5h",a,a.five_hour_pct,a.five_hour_resets_at)+win("7d",a,a.seven_day_pct,a.seven_day_resets_at)).replace(/^<br>/,"")
      +(a.is_using_overage?`<br>• <b title="a window is exhausted and requests are billing as extra usage">OVERAGE</b>`:"")
      +`</div>`;
  }).join("")
    // accounts in the settings graph that no engine has reported usage for yet
    +((sgCache&&sgCache.nodes)||[]).filter(n=>n.type==="account"&&!n.placeholder&&billed.has(n.key||n.name)&&!best[n.key||n.name]).map(n=>{
      const prov=(sgCache.edges||[]).find(e=>e.type==="of"&&e.from===n.id&&e.active!==false);
      return `<div class="eng acct"><b>${esc(n.name)}</b> <a class="sgl" data-sgraph="${esc(n.id)}" title="this account in the settings graph">↗</a>${acctSw(n.key||n.name)}<span class="kv">${esc(prov?prov.to.replace(/^provider:/,""):"no provider")} · no usage reported yet</span></div>`;
    }).join("")
    ||`<div class='eng kv'>no accounts bill ${esc(nameOf("project",project))} yet — add a bills edge (account → project) in the settings graph</div>`;
  $("#accounts").querySelectorAll("[data-sgraph]").forEach(a=>a.onclick=ev=>{ev.preventDefault();ev.stopPropagation();openSettingsGraph(a.dataset.sgraph);});
  wireSwitches($("#accounts"));
}

async function load(){
  $("#login").style.display="none";$("#layout").style.display="flex";$("#top").style.display="";
  $("#who").textContent=me||"";
  const[projects,engines,agents,meRow,srv]=await Promise.all([api("/api/projects"),api("/api/engines"),api("/api/agents").catch(()=>[]),
    me?api("/api/users/"+encodeURIComponent(me)).catch(()=>null):null,api("/api/server").catch(()=>null)]);
  agentsCache=agents;projectsCache=projects;enginesCache=engines;serverRow=srv||{active:true};
  // the settings graph says which engine serves which project (iter5); read once per refresh, best effort
  try{sgCache=await api("/api/settings/graph");}catch(e){sgCache=null;}
  if(meRow&&meRow.role){myRole=meRow.role;try{localStorage.setItem("iter5.role",myRole);}catch(e){}}

  $("#tz").onchange=async()=>{

    if(me){try{const fresh=await api("/api/users/"+encodeURIComponent(me));fresh.timezone=userTz;

  try{const lp=localStorage.getItem("iter5.project");if(lp&&!project&&projects.some(p=>rid(p)===lp))project=lp;}catch(e){}
  // each project: its switch, and what else keeps it from running (server, no engine, engines off)
  $("#projects").innerHTML=projects.map(p=>{
    const why=projBlock(p);
    return `<div class="projrow"><button class="proj ${rid(p)===project?"sel":""}" data-p="${esc(rid(p))}">${esc(rname(p))}</button>`
      +projSwHtml(p,isAdmin())+`<button class="gear" data-gear="project" data-name="${esc(rid(p))}" title="project settings">⚙</button></div>`
      +(why?`<div class="swnote projnote" title="nothing new starts for this project until this is fixed">⚠ ${esc(why)}</div>`:"");}).join("")||"<span class='kv'>none yet</span>";
  document.querySelectorAll("#projects .proj").forEach(b=>b.onclick=()=>loadItems(b.dataset.p));
  wireSwitches($("#projects"));
  // the server's switch is the master switch: Stopped, no engine starts anything for any project
  const srvOn=swOn(serverRow);
  $("#dataserver").innerHTML=`<span class="dot ${srvOn?"on":"off"}"></span><b>iter_data</b> ${esc(location.host)} <button class="gear" data-gear="data" title="iter_data settings">⚙</button>`
    +`<div class="swrow">${swHtml("iter_data:self",srvOn,isAdmin(),"the iter_data server (every engine, every project)")}${srvOn?"":`<span class="swnote">master switch: nothing new starts anywhere</span>`}</div>`;
  wireSwitches($("#dataserver"));
  const now=Date.now();
  $("#engines").innerHTML=engines.map(e=>{
    const seen=e.last_seen?Date.parse(e.last_seen):0;
    const alive=seen&&(now-seen)<3*(e.ticksec||5)*1000+5000;
    const u=e.usage;
    const win=(label,pct,reset)=>`<br>• ${label} <b>${esc(Math.round(pct||0))}%</b> – <span title="resets ${esc(fmtTs(reset?new Date(reset*1000).toISOString():""))} ${esc(tzAbbrev())}">${esc(fmtDur(reset))}</span>`;
    const holding=!!e.hold;   // engine: accounts configured, none under its stop% — nothing runs
    // every account's windows + when it is next under its stop% (engine-owned, soonest first)
    const accts=Array.isArray(e.accounts)?e.accounts:[];
    // an account whose token is not set in the engine's env_file (a.token==="unset", engines since 2026-09-11) is marked, not timed
    const acctList=accts.length?`<br><span class="kv">${accts.map(a=>`<span title="${esc(acctTitle(a))}">${a.token==="unset"?"⚠ "+esc(nameOf("account",a.name))+" no token":esc(nameOf("account",a.name))+" "+esc(a.available_at&&a.available_at>Date.now()/1000?fmtDur(a.available_at):(a.available_at?"now":"?"))}</span>`).join(" · ")}</span>`:"";
    const nx=e.next&&e.next.account?e.next:null;
    const usage=holding?`<br>• 5h <b>--</b><br>• 7d <b>--</b>`
      +(nx?`<br>• next: <b>${esc(nx.account)}</b> <span title="at ${esc(at(nx.available_at))}">${esc(nx.available_at>Date.now()/1000?"in "+fmtDur(nx.available_at):"resetting…")}</span>`:`<br>• next: <span class="kv">no reset time on record</span>`)
      +acctList
      :u?win("5h",u.five_hour_pct,u.five_hour_resets_at)+win("7d",u.seven_day_pct,u.seven_day_resets_at)
      +(u.is_using_overage?`<br>• <b title="a window is exhausted and requests are billing as extra usage">OVERAGE</b>`:"")
      +(u.age_sec!=null&&u.age_sec>900?`<br><span class="kv" title="snapshot age">usage snapshot ${esc(Math.round(u.age_sec/60))}m old</span>`:""):"<br>• usage: —";
    const acctLabel=holding?"":` on <b title="${esc(accts.map(acctTitle).join("\n"))}">${esc(nameOf("account",(u&&u.account!=null?u.account:e.account))||"default")}</b>`;
    const t=e.test_result;

      :t?`<span class="kv" title="${esc(t.error||t.text||"")}">${t.ok?"✓":"✗"} ${esc(fmtTs(t.ts))}${t.ms?" "+(t.ms/1000).toFixed(1)+"s":""}${t.error?" "+esc(String(t.error).slice(0,40)):""}</span>`:"";
    const eOn=swOn(e),canEng=isAdmin()||(!!me&&e.user===me);
    const sw=`<div class="swrow">${swHtml("iter_engine:"+rid(e),eOn,canEng,"engine "+rname(e))}${eOn&&!srvOn?`<span class="swnote">idle: server is Stopped</span>`:""}</div>`;
    return `<div class="eng"><button class="gear" data-gear="engine" data-name="${esc(rid(e))}" title="engine settings">⚙</button><span class="dot ${alive?"on":"off"}"></span><b title="id: ${esc(rid(e))}">${esc(rname(e))}</b>${holding?` <span title="${esc(e.hold)}">Suspended, ${esc(holdText(e.hold))}</span>`:(e.state&&e.state!=="Running"?" "+esc(e.state):"")}${alive?"":" (offline)"}${acctLabel}${sw}${usage.replace(/^<br>/,"")}
      <br>seen: ${esc(fmtTs(e.last_seen)||"never")}${e.host?" · "+esc(e.host):""}
      <br>serves: ${servesOf(e).map(p=>`<a class="sgl" data-sgraph="project:${esc(p)}">${esc(nameOf("project",p))}</a>`).join(", ")||"—"} <a class="sgl" data-sgraph="iter_engine:${esc(rid(e))}" title="this engine in the settings graph">↗</a>
      <br><button class="ghost sm" data-test="${esc(rid(e))}" ${e.test_requested?"disabled":""}>test</button> ${test}</div>`;
  }).join("")||"<div class='eng kv'>no engines registered</div>";
  wireSwitches($("#engines"));
  document.querySelectorAll("[data-test]").forEach(b=>b.onclick=async ev=>{
    ev.stopPropagation();
    const name=b.dataset.test;b.disabled=true;b.textContent="testing…";
    try{
      const r=await api("/api/engines/"+encodeURIComponent(name)+"/test",{method:"POST",body:"{}"});
      const t0=Date.now();
      while(Date.now()-t0<120000){
        await new Promise(res=>setTimeout(res,2000));
        const e=await api("/api/engines/"+encodeURIComponent(name));
        if(!e.test_requested&&e.test_result&&e.test_result.requested===r.requested){await load();return;}
      }
      alert(`No answer from ${name} within 2 minutes — is the engine running?`);await load();
    }catch(e){alert("test failed: "+e.message);await load();}
  });
  const canAdmin=isAdmin();
  document.querySelectorAll("[data-sgraph]").forEach(a=>a.onclick=ev=>{ev.preventDefault();ev.stopPropagation();openSettingsGraph(a.dataset.sgraph);});
  $("#map-open").onclick=()=>openMap().catch(e=>alert("map: "+e.message));
  $("#engine-add").hidden=!canAdmin;
  document.querySelectorAll("[data-gear]").forEach(g=>g.onclick=ev=>{ev.stopPropagation();openSettings(g.dataset.gear,g.dataset.name);});
  {const hp=hashParams().get("p");if(hp&&projects.some(p=>rid(p)===hp))project=hp;}
  // the tab the URL (or the last visit) asked for, read before loadItems rewrites the hash
  let t=hashParams().get("tab");if(!t){try{t=localStorage.getItem("iter5.tab");}catch(e){}}
  if(["intro","queue","graph","rag","settings"].includes(t))tab=t;
  if(projects.length&&!project)project=rid(projects[0]);
  fillProjPick();
  renderAccounts(engines);
  if(project)await loadItems(project);else renderCounts();
  await setTab(tab);
  if(!usageOpened){usageOpened=true;setTimeout(()=>refreshUsage(false),500);}

/* Project graph summary (iter5): node counts by type and the file-sync state,
   from GET graph/stats (tolerant of its shape); the tab itself draws the graph. */
const MAP_ICON={project:"◆",code:"▣",context:"▣",container:"▢",component:"▪",connection:"◇",test:"✓",bizreq:"B",techreq:"T",philosophy:"✦",usecase:"☺",actor:"☻"};
async function renderMapStats(p){
  const st=await api("/api/projects/"+encodeURIComponent(p)+"/graph/stats");
  const by=st.by_nodetype||st.nodetypes||{};
  const total=st.nodes??st.vertices??Object.values(by).reduce((a,b)=>a+(+b||0),0);
  if(!total){$("#mapstats").innerHTML="<div class='eng kv'>no nodes yet — design one in the Project graph tab</div>";return;}
  const order=["project","context","container","component","connection","code","test","bizreq","techreq","philosophy","usecase","actor"];
  const types=Object.entries(by).map(([t,n])=>[t.replace(/^code\//,""),n]).filter(([t])=>MAP_ICON[t]).sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0])).map(([t,n])=>`<span><i>${MAP_ICON[t]}</i>${esc(t)}<b>${esc(n)}</b></span>`).join("");
  const fs=st.by_file_state||st.file_states||{};
  const pend=(fs.pending_write||0)+(fs.pending_delete||0),designed=fs.designed||0;
  $("#mapstats").innerHTML=`<div class="eng">${esc(total)} nodes · ${esc(st.edges??st.links??"?")} links
    <div class="mstats">${types}</div>
    ${pend?`<br><span style="color:var(--warn)">⟳ ${pend} waiting for an engine to write</span>`:""}${designed?`<br><span style="color:var(--accent)">✎ ${designed} designed (not built yet)</span>`:""}</div>`;
}
function openMap(focus){return setTab("graph").then(()=>{if(focus&&window.IterGraph&&IterGraph.focus)setTimeout(()=>IterGraph.focus(focus),500);});}

/* Lease-bound locks (CR 2026-09-25): a red row per loop in the wait-for graph
   (nothing in it can start until a link is removed) and an amber row when lock
   rows are held by items that are not running.  Members open the item. */
function renderDeadlocks(dl){
  const el=$("#deadlocks");if(!el)return;
  if(!dl){el.innerHTML="";return;}
  const link=id=>`<a href="#" data-open="${esc(id)}">${esc(id.slice(-12))}</a>`;
  const rows=(dl.cycles||[]).map(c=>{
    const e=c.edges||[];
    const hops=e.map(x=>` -(${esc(x.kind==="lock"?"lock "+(x.path||""):x.kind)})-> ${link(x.to)}`).join("");
    return `<div class="dl red"><b>deadlock:</b> ${e.length?link(e[0].from):""}${hops}${c.auto_resolvable?" · a holder is not running; the engine releases its locks":""}</div>`;
  });
  const n=(dl.stale_lock_rows||[]).length;
  if(n)rows.push(`<div class="dl amber">${n} lock row${n===1?" is":"s are"} held by items that are not running (${(dl.stale_lock_rows||[]).slice(0,5).map(r=>link(r.workid)).join(", ")}${n>5?", …":""})</div>`);
  el.innerHTML=rows.join("");
  el.querySelectorAll("a[data-open]").forEach(a=>a.onclick=ev=>{ev.preventDefault();openDetail(a.dataset.open);});
}

/* The selected project's status line: what keeps it from starting work (the server or project
   switch, a drain), its engines, what runs, today's spend. The switches themselves are in the
   left pane; the status endpoint says whether every engine has honored a drain. */
async function renderProjectCtl(){
  if(!project){$("#projctl").innerHTML="";return;}
  const pp="/api/projects/"+encodeURIComponent(project);
  let proj=await api(pp);
  if(proj.state==="Draining"){ // transitional: settle to Stopped as soon as nothing runs
    try{const r=await api(pp+"/settle",{method:"POST",body:"{}"});if(r.settled)proj=await api(pp);}catch(e){}
  }
  const [status,spend]=await Promise.all([api(pp+"/status").catch(()=>null),api(pp+"/spend").catch(()=>[])]);
  const today=new Date().toISOString().slice(0,10);
  const todaySpend=(spend.find(r=>r.date===today)||{}).usd||0;
  const capTxt=proj.maxdailycost==null?"":(proj.maxdailycost===0?" <span style='color:var(--bad)'>(budget $0: spend nothing)</span>":` / $${Number(proj.maxdailycost).toFixed(2)} cap`);
  const engs=status?status.engines:[];
  const total=engs.length,live=engs.filter(e=>!e.stale).length,on=engs.filter(e=>!e.stale&&e.active!==false).length;
  const running=status?(status.inprogress||0):0;
  // one compact line: why nothing new starts (if so), engines (green / red dot), running,
  // today's spend — nothing queued starts without an online engine that is switched on
  const engTitle=!status?"":!total?"No engine serves this project (a serves edge, engine → project, in the settings graph), so queued work will not start"
    :!live?"No engine serving this project has checked in during the last few ticks, so queued work will not start"
    :!on?"Every online engine serving this project is switched off (left pane), so queued work will not start"
    :`${on} of ${total} engines serving ${nameOf("project",project)} are online and switched on`;
  // phones show the short forms (.ps-s): a dot + on/total, and running as a small count pill
  const bad=status&&!on,setup=status&&!live;
  const engLong=!total?"no engine serves this project":!live?`${total} engine${total===1?"":"s"}, none online`:!on?`${live} engine${live===1?"":"s"} online, switched off`:`${on}/${total} engine${total===1?"":"s"} online`;
  const why=status&&status.server_active===false?"server Stopped":proj.state==="Stopped"?"project Stopped":proj.state==="Draining"?`stopping… (${running} running)`:"";
  let note=(why?`<span class="ps-g"><span class="ps-off" title="nothing new starts — the switches are in the left pane">${esc(why)}</span></span>`:"")
    +`<span class="ps-g"><span class="ps-eng ${bad?"bad":"ok"}" title="${esc(engTitle+(setup?" — click for engine setup":""))}"><i></i><span class="ps-l">${engLong}</span><span class="ps-s">${on}/${total}</span></span>`
    +(setup?`<button class="engsetup" title="The steps to set up and start an engine for this project">Engine setup</button>`:"")+`</span>`
    +`<span class="ps-g"><span class="ps-run" title="${running} work item${running===1?"":"s"} in progress"><span class="ps-l">${running} running</span><span class="ps-s">▶ ${running}</span></span><span title="spend today (UTC)">$${todaySpend.toFixed(2)} today${capTxt}</span></span>`;
  if(status&&status.not_honoring&&status.not_honoring.length)note+=`<span style="color:var(--bad)">not honoring: ${esc(status.not_honoring.join(", "))}</span>`;
  $("#projctl").innerHTML=`<span class="pstat">${note}</span>`;
  const openSetup=async()=>{const p=project;await setTab("intro");if(window.IterIntro&&IterIntro.openSetup)IterIntro.openSetup(p);};
  const es=$("#projctl").querySelector("button.engsetup");
  if(es)es.onclick=openSetup;
  if(setup){const eb=$("#projctl").querySelector(".ps-eng.bad");if(eb)eb.onclick=openSetup;}
}

/* ---- pinned counts bar: total + per-state; clicks are ADDITIVE (V2 behaviour) ---- */
function renderCounts(){
  const by={};itemsCache.forEach(i=>{by[i.state]=(by[i.state]||0)+1;});
  const chip=(label,n,key,cls,active)=>`
    <div class="count ${cls} ${n===0?"zero":""} ${active?"active":""}" data-k="${key}">
      <b>${n}</b><span>${label}</span></div>`;
  let html=chip("total",itemsCache.length,"","total",filters.size===0);
  for(const s of STATES)html+=chip(s,by[s]||0,s,"c-"+s,filters.has(s));
  $("#chips").innerHTML=html;
  /* a record in-progress with no session behind it (2026-09-22 "ghost"): live
     engines report the threads they run per project; the chip warns when the
     store counts more (or fewer) than they do */
  const ipc=document.querySelector("#chips .count.c-in-progress");
  const nowMs=Date.now();
  const reporting=enginesCache.filter(e=>e.running_by_project&&e.last_seen&&(nowMs-Date.parse(e.last_seen))<3*(e.ticksec||5)*1000+5000);
  if(ipc&&reporting.length){
    const m=reporting.reduce((a,e)=>a+(e.running_by_project[project]||0),0),n=by["in-progress"]||0;
    ipc.title=`${n} in-progress · engines report ${m} running`;

  }
  document.querySelectorAll("#chips .count").forEach(c=>c.onclick=()=>{
    const k=c.dataset.k;
    if(!k)filters.clear();else if(filters.has(k))filters.delete(k);else filters.add(k);
    renderCounts();renderItems();
  });
  /* usecase progress (decided 2026-09-08): N of M items carrying usecase:<name> are complete;
     scheduled items are left out — a recurring schedule never closes, so counting it held
     the chip short of M/M forever (Stephen 2026-09-22) */
  const uc={};
  itemsCache.filter(i=>i.state!=="scheduled").forEach(i=>chipKeysOf(i).forEach(n=>{const u=uc[n]=uc[n]||{total:0,done:0,prio:null};u.total++;if(i.state==="complete")u.done++;if(u.prio==null||(i.priority??PRIO_DEFAULT)<u.prio)u.prio=i.priority??PRIO_DEFAULT;}));
  const sumRank=n=>{const x=SUMMARY_TAGS.indexOf(n);return x<0?SUMMARY_TAGS.length:x;}; // summary tags pinned first, in SUMMARY_TAGS order
  const names=Object.keys(uc).sort((a,b)=>(sumRank(a)-sumRank(b))||(uc[a].prio-uc[b].prio)||a.localeCompare(b));
  if(ucFilter&&!uc[ucFilter])ucFilter="";
  $("#ucrow").classList.toggle("empty",names.length===0);
  $("#ucchips").innerHTML=names.map(n=>{const u=uc[n],pct=u.total?Math.round(100*u.done/u.total):0;
    const sum=SUMMARY_TAGS.includes(n),fill=sum?tagColor({text:n}):UC_COLOR;
    return `<div class="count uc ${sum?"sum":""} ${ucFilter===n?"active":""} ${u.done===u.total?"done":""}" data-uc="${esc(n)}" title="${u.done} of ${u.total} items ${sum?`tagged ${n} `:""}complete (${pct}%) — click to filter" style="background:linear-gradient(90deg,${fill}55 ${pct}%,var(--bg) ${pct}%)"><b>${u.done}/${u.total}</b><span><em class="ucprio">P${u.prio}</em>${esc(n)}</span></div>`;}).join("");
  document.querySelectorAll("#ucchips .count").forEach(c=>c.onclick=()=>{ucFilter=(ucFilter===c.dataset.uc)?"":c.dataset.uc;renderCounts();renderItems();});

/* ---- run order: only what can run, plus whatever a runnable item is stuck behind ---- */
/* dependency gate, DEEP like the engine: a blocker counts only when it and everything
   it created (createdby, transitively) closed complete; blockedby_shallow opts out */
let kidsIndex={};
function buildKids(items){kidsIndex={};items.forEach(i=>{if(i.createdby)(kidsIndex[i.createdby]=kidsIndex[i.createdby]||[]).push(i);});}
/* target reachable from `from` over blockedby links (iter_core::waits_on) */
function waitsOn(from,target,byId){
  const seen=new Set(),stack=[from];
  while(stack.length){const cur=stack.pop();if(cur===target)return true;if(seen.has(cur))continue;seen.add(cur);const x=byId[cur];if(x)(x.blockedby||[]).forEach(b=>stack.push(b));}
  return false;
}
/* mirrors iter_core::dependency_status (2026-09-11): an open blocker that waits on
   this item is a {cycle} — neither can ever start; a descendant of a complete
   blocker that waits on this item is skipped — the explicit link wins */
function depStatus(i,byId){
  const seen=new Set();
  for(const d of (i.blockedby||[])){
    const dep=byId[d];if(!dep)continue;
    if(dep.state==="failed")return {failed:dep.id};
    if(dep.state!=="complete")return waitsOn(dep.id,i.id,byId)?{cycle:dep.id}:{waiting:dep.id};
    if(i.blockedby_shallow)continue;
    const stack=[...(kidsIndex[d]||[])];
    while(stack.length){
      const c=stack.pop();if(c.id===i.id||seen.has(c.id))continue;seen.add(c.id);
      if(c.state!=="complete"&&waitsOn(c.id,i.id,byId))continue;
      if(c.state==="failed")return {failed:c.id,via:d};
      if(c.state!=="complete")return {waiting:c.id,via:d};
      (kidsIndex[c.id]||[]).forEach(x=>stack.push(x));
    }
  }
  return {ok:true};
}
function depsSatisfied(i,byId){return depStatus(i,byId).ok===true;}
function runnable(i){return i.state==="in-progress"||(i.state==="queued"&&!i.needs_approval);}
function runGroup(i,byId){
  if(i.state==="in-progress")return 0;                       // running now
  if(i.state==="queued"&&!i.needs_approval&&depsSatisfied(i,byId))return 1; // next up
  if(i.state==="question")return 2;
  if(i.state==="queued")return depStatus(i,byId).cycle?4:3;  // blocked / needs approval; a declared loop last
  if(i.state==="paused")return 5;
  if(i.state==="parked")return 6;
  if(i.state==="scheduled")return 7;
  if(i.state==="failed")return 8;
  return 9;                                                  // complete
}
/* tree parent = the item this one is actually WAITING ON (deep gate): the open
   blocker, or the open descendant of a complete blocker — or, for a queued item
   whose lockdirs overlap a running item's lock, that lock holder (the engine
   records it in blockedby_locks, 2026-09-07).  An unblocked item is a root; an
   item is never shown under the item that created it. */
let parentCache={};
function lockHolderOf(i,byId){
  if(i.state!=="queued")return null;
  // any holder, running or not (2026-09-25: a waiter under a holder that is
  // not running was shown as an idle root, and the leaked lock was invisible)
  const h=(i.blockedby_locks||[]).find(x=>byId[x]);
  return h||null;
}
function parentOf(i,ids){
  if(CLOSED.has(i.state)||i.state==="in-progress")return null; // not waiting on anything
  if(parentCache[i.id]===undefined){
    const byId={};itemsCache.forEach(x=>{byId[x.id]=x;});
    const ds=depStatus(i,byId);
    parentCache[i.id]=ds.waiting||ds.failed||lockHolderOf(i,byId)||null;
  }
  const p=parentCache[i.id];
  return (p&&p!==i.id&&ids.has(p))?p:null;
}
/* run order: runnable items plus everything they are (transitively) waiting on */
function runView(items){
  parentCache={};
  const byId={};items.forEach(i=>{byId[i.id]=i;});
  const ids=new Set(items.map(i=>i.id));
  const keep=new Set();
  items.filter(runnable).forEach(i=>{
    let cur=i,guard=0;
    while(cur&&guard++<64){
      if(keep.has(cur.id))break;
      keep.add(cur.id);
      const p=parentOf(cur,ids);
      cur=p?byId[p]:null;
    }
  });
  return items.filter(i=>keep.has(i.id));
}
const stateOrder={"in-progress":0,"queued":1,"question":2,"paused":3,"parked":4,"scheduled":5,"failed":6,"complete":7};
function comparator(mode,byId){
  const prio=(a,b)=>(a.priority??PRIO_DEFAULT)-(b.priority??PRIO_DEFAULT)||(a.ts?.receive||"").localeCompare(b.ts?.receive||"");
  switch(mode){
    case "state":     return (a,b)=>(stateOrder[a.state]??9)-(stateOrder[b.state]??9)||prio(a,b);
    case "priority":  return prio;
    case "requested": return (a,b)=>(b.ts?.receive||"").localeCompare(a.ts?.receive||"");
    case "completed": return (a,b)=>(b.ts?.complete||"").localeCompare(a.ts?.complete||"");
    case "agent":     return (a,b)=>(a.agent||"").localeCompare(b.agent||"")||prio(a,b);
    case "requestor": return (a,b)=>(a.requestedby||"").localeCompare(b.requestedby||"")||prio(a,b);
    default:          return (a,b)=>runGroup(a,byId)-runGroup(b,byId)||prio(a,b); // runorder
  }
}

/* depth = how far down the dependency/creation tree this item sits; 22px per level,
   no cap — a deep chain is supposed to look deep */
let cycleMap={}; // id -> the open blocker it loops with, for the tiles of the current render
function tileHtml(i,depth){
  const att=(cycleMap[i.id]?` <span class="att" style="color:var(--bad)" title="this item and ${esc(cycleMap[i.id])} each wait on the other: neither can ever start — remove one link">⟲ cycle with ${esc(cycleMap[i.id].slice(-12))}</span>`:"")+(i.attempt>0?` <span class="att">(A${esc(i.attempt)})</span>`:"")+(i.run_now&&i.state==="queued"?` <span class="att" title="run-now override requested">▶ run now</span>`:"")+(i.stop_requested&&i.state==="in-progress"?` <span class="att" style="color:var(--bad)">■ stopping</span>`:"")+(i.explain_requested?` <span class="att" title="ELI5 requested — the engine is writing a plain-language explanation">✎ explaining…</span>`:"");
  return `
  <div class="tile" data-depth="${depth}" style="--d:${depth};margin-left:${depth*22}px" data-id="${esc(i.id)}">
    <div class="left">
      <span class="state ${esc(i.state)}">${esc(i.state)}</span>
      <span class="prio">P${esc(i.priority??PRIO_DEFAULT)}</span>
      <span class="nm">${esc(i.name)}</span>
      <span class="agent">${esc(i.agent||"")}</span>${att}
    </div>
    <div class="right">
      ${tagsHtml(i)}
      <span>${esc(fmtTs(i.ts&&i.ts.receive))}</span>
      <span class="id" title="click to copy full id">${esc(i.id.slice(-12))}</span>
      <button class="ghost sm actbtn" data-act-for="${esc(i.id)}">Actions ▾</button>
    </div>
  </div>`;
}

/* depth ruler: line the header ticks up with where tiles of each depth start */
let lastMaxDepth=-1;
function placeDepthTicks(maxDepth){
  const el=$("#depthticks");if(!el)return;
  lastMaxDepth=maxDepth;
  const main=document.querySelector("main"),layout=$("#layout");
  const hidden=maxDepth<0||!main||!layout||getComputedStyle(layout).display==="none";
  el.classList.toggle("hide",hidden);
  if(hidden)return;
  el.style.setProperty("--tick-n",String(maxDepth+1));
  const x=main.getBoundingClientRect().left+parseFloat(getComputedStyle(main).paddingLeft)-$("#top").getBoundingClientRect().left;
  el.style.setProperty("--tick-x",x+"px");
}
window.addEventListener("resize",()=>placeDepthTicks(lastMaxDepth));

function renderItems(){
  const mode=$("#sort").value;
  const byId={};itemsCache.forEach(i=>{byId[i.id]=i;});
  const cmp=comparator(mode,byId);
  let shown,html="";
  const base=ucFilter?itemsCache.filter(i=>chipKeysOf(i).includes(ucFilter)):itemsCache;
  if(mode==="runorder"&&filters.size===0){
    shown=runView(base);
    $("#viewnote").textContent=`run order: ${shown.length} of ${base.length} — runnable items and what they are stuck behind${ucFilter?` · ${chipLabel(ucFilter)}`:""}`;
  }else{
    shown=base.filter(i=>filters.size===0||filters.has(i.state));
    $("#viewnote").textContent=(filters.size||ucFilter)?`${shown.length} shown (${[...filters,...(ucFilter?[chipLabel(ucFilter)]:[])].join(" + ")})`:"";
  }
  /* every view nests: an item sits under what it is waiting on, as deep as the chain goes */
  let maxDepth=-1;
  {
    if(!(mode==="runorder"&&filters.size===0))parentCache={};
    cycleMap={};shown.forEach(i=>{if(i.state==="queued"){const ds=depStatus(i,byId);if(ds.cycle)cycleMap[i.id]=ds.cycle;}});
    const ids=new Set(shown.map(i=>i.id));
    const children={},roots=[];
    shown.forEach(i=>{const p=parentOf(i,ids);if(p){(children[p]=children[p]||[]).push(i);}else roots.push(i);});
    roots.sort(cmp);
    const seen=new Set();
    const emit=(i,depth)=>{if(seen.has(i.id))return "";seen.add(i.id);if(depth>maxDepth)maxDepth=depth;
      return tileHtml(i,depth)+((children[i.id]||[]).sort(cmp).map(c=>emit(c,depth+1)).join(""));};
    html=roots.map(r=>emit(r,0)).join("");
    // never drop an item: whatever no root reaches (a loop the gate does not
    // name) still renders, in the view's own order rather than fetch order
    shown.filter(i=>!seen.has(i.id)).sort(cmp).forEach(i=>{html+=emit(i,0);});
  }
  $("#items").innerHTML=html||"<span class='kv'>no workitems</span>";
  placeDepthTicks(maxDepth);
  document.querySelectorAll("#items .tile").forEach(t=>{
    t.onclick=e=>{
      if(e.target.classList.contains("actbtn")){e.stopPropagation();openMenu(t.dataset.id,e.target);return;}
      if(e.target.classList.contains("id")){
        navigator.clipboard&&navigator.clipboard.writeText(t.dataset.id);
        e.target.textContent="copied!";
        setTimeout(()=>{e.target.textContent=t.dataset.id.slice(-12);},900);
        return;
      }
      openDetail(t.dataset.id);
    };
  });
}

/* jump to a workitem line in the queue and flash it */
function jumpToItem(id){
  const t=document.querySelector(`#items .tile[data-id="${CSS.escape(id)}"]`);
  if(!t){ // not in the current view: show everything by state and retry once
    if(filters.size||$("#sort").value==="runorder"){filters.clear();$("#sort").value="state";renderCounts();renderItems();return jumpToItem(id);}
    return;
  }
  t.scrollIntoView({block:"center",behavior:"smooth"});
  t.classList.remove("flash");void t.offsetWidth; // restart animation
  t.classList.add("flash");
  setTimeout(()=>t.classList.remove("flash"),2000);
}
