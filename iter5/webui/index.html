/* the engine-owned test sweep (2026-09-30): one per project, created paused;
   it can be turned on and off, run now and edited, but never deleted or closed */
function isSweepTemplate(i){return i.system==="test-sweep"&&!!(i.sched&&i.sched.kind);}
function menuItems(i){
  const b=(act,label,cls="")=>`<button data-act="${act}" class="${cls}">${label}</button>`;
  const note=t=>`<span class="note">${t}</span>`;
  const s=i.state;
  if(isSweepTemplate(i)){
    return (s==="scheduled"?b("pause","Pause schedule (turn off)"):b("schedule","Resume schedule (turn on)"))+b("runnow","Run now")+
      b("setprio","Set priority…")+b("pauseedit","Pause &amp; edit (interval, flags)")+b("addtag","Add tag…")+b("eli5","ELI5 (explain simply)")+`<div class="sep"></div>`+
      note("The project's test sweep, owned by the engine. When due it runs at once on its timer — no agent slot, no usage hold — while the project is Running: every test group the map allows, then one code item per red group, one test item per code node with no tests, one ingest item per unclear node. Pause turns it off; it cannot be deleted.");
  }
  if(CLOSED.has(s)){
    const att=i.attempt?` after ${i.attempt} attempt${i.attempt===1?"":"s"}`:"";
    return b("clone","Clone (run it again)")+(s==="complete"?b("followup","Create follow-up request"):"")+
      b("reopen","Reopen (back to queued)…")+b("changeto","Change to…")+b("doc","Append doc…")+b("addtag","Add tag…")+b("eli5","ELI5 (explain simply)")+`<div class="sep"></div>`+
      note(`Closed ${esc(s)}${esc(att)} — a closed item is immutable; docs can be appended, or reopen it.`)+
      b("delete","Delete from archive…","danger");
  }
  if(s==="in-progress"){
    return b("setprio","Set priority…")+b("changeto","Change to…")+b("clone","Clone")+b("addtag","Add tag…")+b("eli5","ELI5 (explain simply)")+`<div class="sep"></div>`+
      (i.stop_requested?note("Stop requested — the engine kills the session on its next tick and parks the item."):b("stopitem","Stop (halt mid-run)…","danger"))+
      note("Agent is running. Stop kills its session and parks the item for review; changes it already committed stay in git.");
  }
  if(s==="scheduled"){
    return b("runnow","Run now")+b("setprio","Set priority…")+b("pause","Pause schedule")+b("pauseedit","Pause &amp; edit")+
      b("complete","Complete (retire schedule)")+b("changeto","Change to…")+b("clone","Clone")+b("addtag","Add tag…")+b("eli5","ELI5 (explain simply)")+`<div class="sep"></div>`+
      note("Run now clones this schedule into a queued run.")+b("delete","Delete","danger");
  }
  if(s==="question"){
    return b("answer","Answer…")+b("queue","Queue without answering")+b("park","Park")+b("setprio","Set priority…")+b("pauseedit","Pause &amp; edit")+
      b("complete","Complete (no work needed)")+b("changeto","Change to…")+b("clone","Clone")+b("addtag","Add tag…")+b("eli5","ELI5 (explain simply)")+`<div class="sep"></div>`+
      note("An agent is waiting on this decision — open the item and answer there.")+b("delete","Delete","danger");
  }
  let rows=[];
  if(s==="queued")rows.push(b("runnow_item",i.run_now?"Run now (already requested)":"Run now (override agent cap)"));
  if(s==="parked"||s==="paused")rows.push(b("queue","Queue"));
  if(s==="parked"||s==="paused")rows.push(b("runnow_item","Queue &amp; run now"));
  if((s==="parked"||s==="paused")&&i.sched&&i.sched.kind)rows.push(b("schedule","Resume schedule"));
  if(s==="parked"||s==="paused")rows.push(b("question","Move to question"));
  if(s==="paused"||s==="queued")rows.push(b("park","Park"));
  rows.push(b("setprio","Set priority…"));rows.push(b("complete","Complete"));rows.push(b("changeto","Change to…"));rows.push(b("pauseedit","Pause &amp; edit"));rows.push(b("clone","Clone"));rows.push(b("addtag","Add tag…"));rows.push(b("eli5","ELI5 (explain simply)"));
  rows.push(`<div class="sep"></div>`);rows.push(b("delete","Delete","danger"));
  return rows.join("");
}
function openMenu(id,anchor){
  const i=itemsCache.find(x=>x.id===id);if(!i)return;
  /* a modal <dialog> sits in the browser's top layer: everything outside it is
     inert and drawn under the backdrop, so when the anchor is inside an open
     dialog the menu must live inside that dialog too (2026-09-09 fix) */
  const host=anchor.closest("dialog")||document.body;
  if(menu.parentElement!==host)host.appendChild(menu);
  const fromDlg=host===dlg;
  const render=html=>{
    menu.innerHTML=html;
    menu.hidden=false;
    const r=anchor.getBoundingClientRect();
    menu.style.top=Math.min(r.bottom+4,window.innerHeight-menu.offsetHeight-8)+"px";
    menu.style.left=Math.max(8,Math.min(r.right-menu.offsetWidth,window.innerWidth-menu.offsetWidth-8))+"px";
    menu.querySelectorAll("button[data-act]").forEach(btn=>btn.onclick=onAct);
  };
  const head=`<span class="note"><b>${esc(i.name.slice(0,60))}</b> · ${esc(i.state)}</span>`;
  const onAct=async e=>{
    e.stopPropagation();
    const act=e.currentTarget.dataset.act;
    /* Change to…: a second level listing every other state (the shortcuts
       above stay; this is the escape hatch, e.g. failed -> complete) */
    if(act==="changeto"){
      render(`<span class="note"><b>${esc(i.name.slice(0,60))}</b> · ${esc(i.state)} → change to…</span>`+
        ALL_STATES.filter(s=>s!==i.state).map(s=>`<button data-act="state:${s}" class="${CLOSED.has(s)?"danger":""}">${esc(s)}</button>`).join("")+
        `<div class="sep"></div><button data-act="back">← back</button>`);
      return;
    }
    if(act==="back"){render(head+menuItems(i));return;}
    closeMenu();
    if(act==="addtag"){if(fromDlg){dlgDirty=false;dlg.close();}return openTagPicker(i,fromDlg);}
    /* from the lightbox: close it first (forms / jumps need the list), then
       reopen it on the refreshed item for plain state changes */
    if(fromDlg&&act!=="answer"&&act!=="doc"&&act!=="eli5"){dlgDirty=false;dlg.close();}
    try{await doAction(act,i);}catch(err){alert("action failed: "+err.message);return;}
    if(fromDlg&&!["answer","doc","delete","pauseedit","clone","runnow","followup"].includes(act)&&itemsCache.some(x=>x.id===i.id))openDetail(i.id);
  };
  render(head+menuItems(i));menuOpenedAt=Date.now();
}
async function fresh(id){return api(P(id));}
async function setState(i,state,mutate){
  const f=await fresh(i.id);
  f.state=state;if(mutate)mutate(f);
  await api(P(i.id)+"?expect_version="+f.version,{method:"PUT",body:JSON.stringify(f)});
  return f;
}
async function requestText(id){
  const d=await api(P(id)+"/details").catch(()=>[]);
  const r=d.find(x=>x.key==="request");
  return r?(typeof r.value==="string"?r.value:JSON.stringify(r.value,null,2)):"";
}
async function createItem(body,request){
  const created=await api(P(),{method:"POST",body:JSON.stringify(body)});
  await api(P(created.id)+"/details/0",{method:"PUT",body:JSON.stringify({key:"request",valuetype:"text",value:request||""})});
  return created;
}
function cloneBody(i,over={}){
  return {name:i.name,agent:i.agent,exec_shell:i.exec_shell||"",priority:i.priority??PRIO_DEFAULT,lockdirs:i.lockdirs||[],
    blockedby:i.blockedby||[],tags:i.tags||[],prework:i.prework||[],postwork:i.postwork||[],context:i.context||[],model:i.model||"",
    requestedby:me||"",createdby:me||"",state:"queued",...over};
}
async function doAction(act,i){
  switch(act){
    case "answer": return openDetail(i.id);
    case "doc": return openDetail(i.id);
    case "eli5":
      /* ELI5 (spec: Explain / ELI5): read-only explain agent, run at once outside the
         cap, legal in every state; the item shows "✎ explaining…" until "explained" lands */
      await api(P(i.id)+"/explain",{method:"POST",body:"{}"});break;
    case "queue": await setState(i,"queued",f=>{f.needs_approval=false;});break;
    case "runnow_item":{
      const byId={};itemsCache.forEach(x=>{byId[x.id]=x;});
      const ds=depStatus(i,byId);
      if(ds.failed){alert(`Cannot run now: dependency ${ds.failed.slice(-8)} closed failed — retry (reopen) that item and this one flows after it.`);return;}
      if(ds.waiting){alert(`Cannot run now: still waiting on ${ds.waiting.slice(-8)}${ds.via?" (created by blocker "+ds.via.slice(-8)+"; dependencies are deep)":""}`);return;}
      if(i.needs_approval){alert("Cannot run now: this item still needs a signed approval.");return;}
      if(!confirm(`Run "${i.name.slice(0,60)}" now?\nThe engine starts it on its next tick even if the agent cap is full (no other work starts until the count drops back under the cap). It still waits for any overlapping lock to clear.`))return;
      await setState(i,"queued",f=>{f.needs_approval=false;f.run_now=true;});break;}
    default:
      if(act.startsWith("state:")){
        const to=act.slice(6),from=i.state;
        const warn=to==="in-progress"?"\nNote: in-progress is engine-owned — no agent session starts from this; the engine may overwrite it."
          :from==="in-progress"?"\nNote: this does NOT stop a running agent session — use Stop for that."
          :CLOSED.has(to)?"\nNote: closed items are immutable afterwards (docs, tags and reopen only); items blocked by this one may flow.":"";
        const reason=prompt(`Change "${i.name.slice(0,60)}" from ${from} to ${to}?${warn}\nReason (optional, recorded on the item):`,"");
        if(reason===null)return;
        await api(P(i.id)+"/state",{method:"POST",body:JSON.stringify({state:to,reason})});
        break;
      }
      alert("unknown action "+act);return;
    case "setprio":{
      /* in-place re-prioritisation (2026-09-10): one POST, no pause/edit/requeue;
         the whole lineage this item created follows it (children inherit exactly) */
      const cur=i.priority??PRIO_DEFAULT;
      const raw=prompt(`Priority for "${i.name.slice(0,60)}" — currently P${cur}.\n0–99, lower runs sooner: 0–9 do now · 10–39 use cases · 40–49 human · 50+ maintenance.\nApplies to this item and everything it created.`,String(cur));
      if(raw===null)return;
      const p=parseInt(raw,10);
      if(!Number.isInteger(p)||p<0||p>99){alert("priority must be a whole number from 0 to 99");return;}
      const r=await api(P(i.id)+"/priority",{method:"POST",body:JSON.stringify({priority:p})});
      if(r.changed&&r.changed.length>1)console.log(`priority P${p} set on ${r.changed.length} items of the lineage`);
      break;}
    case "park": await setState(i,"parked");break;
    case "pause": await setState(i,"paused");break;
    case "question": await setState(i,"question");break;
    case "schedule": await setState(i,"scheduled");break;
    case "complete":
      if(!confirm(`Mark "${i.name.slice(0,60)}" complete without running it?`))return;
      await setState(i,"complete",f=>{f.ts=f.ts||{};f.ts.complete=new Date().toISOString().replace(/\.\d+Z$/,"Z");});break;
    case "reopen":{
      const reason=prompt("Reopen this item (back to queued; downstream items become blocked again). Reason?");
      if(reason===null)return;
      await api(P(i.id)+"/reopen",{method:"POST",body:JSON.stringify({reason})});break;}
    case "pauseedit":{
      const f=(i.state==="paused")?await fresh(i.id):await setState(i,"paused");
      await loadItems(project);
      return openForm("edit",f);}
    case "clone":{
      const req=await requestText(i.id);
      const c=await createItem(cloneBody(i,{name:i.name}),req);
      await loadItems(project);
      jumpToItem(c.id);return;}
    case "runnow":{
      const req=await requestText(i.id);
      const c=await createItem(cloneBody(i,{source_schedule:i.id,sched:undefined}),req);
      await loadItems(project);
      jumpToItem(c.id);return;}
    case "followup":{
      const req=await requestText(i.id);
      return openForm("followup",{...cloneBody(i,{name:"Follow-up: "+i.name,blockedby:[i.id],tags:[]}),
        _request:`Follow-up to workitem ${i.id} ("${i.name}").\n\nOriginal request:\n${req}\n\n---\nWhat to do now:\n`});}
    case "stopitem":
      if(!confirm(`Stop "${i.name.slice(0,60)}" mid-run?\nThe engine kills the agent session on its next tick and parks the item with a note. Work already committed stays in git (git log to review, git revert to undo).`))return;
      await setState(i,"in-progress",f=>{f.stop_requested=true;});break;
    case "delete":
      if(!confirm(`Delete "${i.name.slice(0,60)}" (${i.id.slice(-8)})? This cannot be undone.`))return;
      await api(P(i.id),{method:"DELETE"});break;
  }
  await loadItems(project);
}

/* ================= add tag (Actions -> Add tag…) =================
   A selector of the project's PINNED tags (project.pinned_tags, decided
   2026-09-09: the tags its agents and scripts react to) followed by the tags
   already in use on this project (fewer typos), or a free-form text with an
   optional color.  One tags-only PUT, so it works on closed items too.
   Engine-owned "blocked by: …" tags are never offered. */
const tagpick=$("#tagpick");
tagpick.addEventListener("click",e=>{if(e.target===tagpick)tagpick.close();});
function knownTags(exclude){
  const seen=new Map();
  itemsCache.forEach(x=>(x.tags||[]).forEach(t=>{
    if(!t||!t.text||t.text.startsWith(BLOCKED_PREFIX)||exclude.has(t.text))return;
    if(!seen.has(t.text))seen.set(t.text,t.color||"");
  }));
  return [...seen.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
}
function pinnedTags(exclude){
  const p=projectsCache.find(x=>rid(x)===project);
  const inUse=new Map(knownTags(new Set()));
  const seen=new Set();
  return ((p&&p.pinned_tags)||[]).map(t=>String(t||"").trim()).filter(t=>t&&!t.startsWith(BLOCKED_PREFIX)&&!exclude.has(t)&&!seen.has(t)&&seen.add(t))
    .map(t=>[t,inUse.get(t)||""]);
}
function openTagPicker(i,reopen){
  const have=new Set((i.tags||[]).map(t=>t&&t.text).filter(Boolean));
  const pinned=pinnedTags(have);
  const pinnedSet=new Set(pinned.map(([t])=>t));
  const known=knownTags(have).filter(([t])=>!pinnedSet.has(t));
  const opt=([t,c])=>`<option value="${esc(t)}" data-color="${esc(c)}">${esc(t)}</option>`;
  tagpick.innerHTML=`<div style="padding:16px;min-width:min(420px,90vw)">
    <div class="dlghead"><h2>Add tag</h2><span class="kv">${esc(i.name.slice(0,60))} · ${esc(i.state)}</span></div>
    <div class="frow"><label>existing tag</label><select id="tp-sel">
      ${pinned.length?`<optgroup label="pinned (project setting)">${pinned.map(opt).join("")}</optgroup>`:""}
      ${known.length?`<optgroup label="in use on this project">${known.map(opt).join("")}</optgroup>`:""}
      <option value="">— free-form —</option></select></div>
    <div class="frow"><label>free-form</label><input id="tp-text" placeholder="new tag text (used when free-form is selected)"></div>
    <div class="frow"><label>color</label><input id="tp-color" placeholder="optional #hex (existing tags keep theirs)"></div>
    <div class="kv" id="tp-err" style="color:var(--bad)"></div>
    <div style="text-align:right;margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
      <button class="ghost" id="tp-cancel">cancel</button><button id="tp-add">add tag</button></div></div>`;
  const sel=tagpick.querySelector("#tp-sel"),txt=tagpick.querySelector("#tp-text"),col=tagpick.querySelector("#tp-color"),err=tagpick.querySelector("#tp-err");
  if(!known.length&&!pinned.length)sel.value="";
  const sync=()=>{txt.disabled=sel.value!=="";if(sel.value==="")txt.focus();};
  sel.onchange=sync;sync();
  tagpick.querySelector("#tp-cancel").onclick=()=>tagpick.close();
  tagpick.querySelector("#tp-add").onclick=async()=>{
    err.textContent="";
    const text=(sel.value!==""?sel.value:txt.value).trim();
    if(!text){err.textContent="pick an existing tag or type a new one";return;}
    if(text.startsWith(BLOCKED_PREFIX)){err.textContent=`"${BLOCKED_PREFIX}…" tags are engine-owned and derived each tick — the engine would remove it`;return;}
    let color=col.value.trim();
    if(color&&!/^#[0-9a-fA-F]{3,8}$/.test(color)){err.textContent="color must be #hex";return;}
    if(!color&&sel.value!=="")color=sel.selectedOptions[0].dataset.color||"";
    if(!color&&text.startsWith(UC_PREFIX))color=UC_COLOR;
    try{
      const f=await fresh(i.id);
      if(!(f.tags||[]).some(t=>t&&t.text===text)){f.tags=[...(f.tags||[]),{text,color}];
        await api(P(i.id)+"?expect_version="+f.version,{method:"PUT",body:JSON.stringify(f)});}
      tagpick.close();await loadItems(project);
      if(reopen&&itemsCache.some(x=>x.id===i.id))openDetail(i.id);else jumpToItem(i.id);
    }catch(e){err.textContent="add failed: "+e.message;}
  };
  tagpick.showModal();
}

/* ================= schedule fields (edit form, scheduled items only) =================
   sched = {kind: every|stale|daily|weekly, every_min, at "HH:MM", day mon..sun, tz, last_fired}
   (iter_core/src/sched.rs); every_min is whole minutes, shown in the largest unit that divides it */
const SCHED_KINDS=["every","stale","daily","weekly"];
const SCHED_DAYS=["mon","tue","wed","thu","fri","sat","sun"];
const SCHED_UNITS=[["days",1440],["hours",60],["minutes",1]];
function schedRows(sc){
  const kind=SCHED_KINDS.includes(sc.kind)?sc.kind:"every";
  const m=sc.every_min||0;
  const [unit,per]=SCHED_UNITS.find(([,p])=>m>0&&m%p===0)||["hours",60];
  const line="display:flex;gap:8px;align-items:center;flex-wrap:wrap";
  return `
      <div class="frow"><label>schedule</label><div><select id="f-sk" style="width:120px">${SCHED_KINDS.map(k=>`<option ${k===kind?"selected":""}>${k}</option>`).join("")}</select>
        <div class="kv">every = N after the last firing · stale = N after the last completion (or firing) · daily / weekly = at a clock time; a time missed while the engine was down is skipped</div></div></div>
      <div class="frow" id="f-sk-int"><label>interval</label><div style="${line}"><input id="f-sn" type="number" min="1" step="1" value="${m?m/per:""}" style="width:90px">
        <select id="f-su" style="width:120px">${SCHED_UNITS.map(([u])=>`<option ${u===unit?"selected":""}>${u}</option>`).join("")}</select></div></div>
      <div class="frow" id="f-sk-at"><label>at</label><div style="${line}"><input id="f-sat" value="${esc(sc.at||"")}" placeholder="HH:MM" style="width:90px">
        <span id="f-sk-day"><select id="f-sday" style="width:90px">${SCHED_DAYS.map(d=>`<option ${d===(sc.day||"").slice(0,3).toLowerCase()?"selected":""}>${d}</option>`).join("")}</select></span>
        <input id="f-stz" value="${esc(sc.tz||"")}" placeholder="time zone, e.g. America/Los_Angeles — blank = UTC" style="width:320px"></div></div>
      <div class="frow"><label>last fired</label><span class="kv">${esc(sc.last_fired||"never")}</span></div>`;
}
function schedShow(){
  const k=form.querySelector("#f-sk").value;
  form.querySelector("#f-sk-int").hidden=!(k==="every"||k==="stale");
  form.querySelector("#f-sk-at").hidden=!(k==="daily"||k==="weekly");
  form.querySelector("#f-sk-day").hidden=k!=="weekly";
}
/* the form's schedule fields onto the existing sched (last_fired kept); throws a message on bad input */
function schedRead(old){
  const v=s=>form.querySelector(s).value.trim();
  const sc={...old,kind:v("#f-sk")};
  if(sc.kind==="every"||sc.kind==="stale"){
    const n=Number(v("#f-sn")),per=SCHED_UNITS.find(([u])=>u===v("#f-su"))[1];
    const min=Math.round(n*per);
    if(!(n>0)||min<1)throw new Error("schedule interval must be more than 0");
    sc.every_min=min;
  }else{
    const at=v("#f-sat").match(/^(\d{1,2}):(\d{2})$/);
    if(!at||+at[1]>23||+at[2]>59)throw new Error("schedule 'at' must be HH:MM (24h)");
    sc.at=at[1].padStart(2,"0")+":"+at[2];
    sc.tz=v("#f-stz");
    if(sc.tz){try{new Intl.DateTimeFormat("en",{timeZone:sc.tz});}catch(e){throw new Error("unknown time zone: "+sc.tz);}}
    if(sc.kind==="weekly")sc.day=v("#f-sday");
  }
  return sc;
}

/* ================= new / edit / follow-up form ================= */
const form=$("#form");
form.addEventListener("click",e=>{if(e.target===form)form.close();});
function openForm(mode,src){
  const i=src||{};
  const title={create:"New workitem",edit:"Edit workitem — "+(i.id||"").slice(-8),followup:"Create follow-up request"}[mode];
  const agentNames=[...new Set([...(agentsCache.map(rid)),"exec",i.agent].filter(Boolean))];
  const lines=a=>(a||[]).join("\n");
  const tagsText=(i.tags||[]).map(t=>t.color?`${t.text}:${t.color}`:t.text).join(", ");
  /* the test sweep template stays a schedule: scheduled (on) or paused (off) */
  const sweepTpl=mode==="edit"&&isSweepTemplate(i);
  const stateOpts=sweepTpl?["scheduled","paused"]:(mode==="edit"?OPEN_TARGETS:["queued","parked","paused","question"]);
  /* a schedule template (scheduled, or paused with a sched) shows its timing */
  const schedTpl=mode==="edit"&&(i.state==="scheduled"||!!(i.sched&&i.sched.kind));
  const curState=sweepTpl?i.state:(mode==="edit"&&OPEN_TARGETS.includes(i.state))?i.state:"queued";
  form.innerHTML=`
    <div style="padding:16px">
      <div class="dlghead"><h2>${esc(title)}</h2><button class="ghost sm" id="f-cancel">cancel</button></div>
      <div class="frow"><label>name</label><input id="f-name" value="${esc(i.name||"")}" placeholder="short label, < 150 chars"></div>
      <div class="frow"><label>agent</label><select id="f-agent">${agentNames.map(a=>`<option ${a===(i.agent||"code")?"selected":""}>${esc(a)}</option>`).join("")}</select></div>
      <div class="frow" id="f-exec-row" ${ (i.agent||"code")==="exec"?"":"hidden"}><label>exec shell</label><textarea id="f-exec" rows="2">${esc(i.exec_shell||"")}</textarea></div>
      <div class="frow"><label>priority</label><input id="f-prio" type="number" min="0" max="99" value="${esc(i.priority??"")}" placeholder="auto" style="width:90px"> <span class="kv">0–99, lower = sooner · 0–9 do now · 10–39 usecases (one number each) · 40–49 human · 50+ maintenance · blank = auto: a root takes the lowest unused number in its band, a child inherits its creator's</span></div>
      <div class="frow"><label>state on save</label><select id="f-state">${stateOpts.map(s=>`<option ${s===curState?"selected":""}>${s}</option>`).join("")}</select></div>${schedTpl?schedRows(i.sched||{}):""}
      <div class="frow"><label>lockdirs</label><textarea id="f-lock" rows="2" placeholder="one per line, e.g. {topdir}/core/repos/x/">${esc(lines(i.lockdirs))}</textarea></div>
      <div class="frow"><label>blocked by</label><textarea id="f-dep" rows="2" placeholder="workitem ids, one per line">${esc(lines(i.blockedby))}</textarea></div>
      <div class="frow"><label>context files</label><textarea id="f-ctx" rows="2" placeholder="one per line; {topdir}/…, {codepath}/…, {marker}, {ancestor_markers}, globs — blank = project default">${esc(lines(i.context))}</textarea></div>
      <div class="frow"><label>model</label><input id="f-model" value="${esc(i.model||"")}" placeholder="blank = agent default (opus | sonnet | haiku | fable)" style="width:260px"></div>
      <div class="frow"><label>tags</label><input id="f-tags" value="${esc(tagsText)}" placeholder="comma separated; optional color: name:#hex"></div>
      <div class="frow"><label>usecase</label><input id="f-uc" value="${esc(ucOf(i)[0]||"")}" placeholder="usecase name → tag usecase:<name>, inherited by every item this one creates" style="width:320px"></div>
      <div class="frow"><label>request</label><textarea id="f-req" rows="16" placeholder="the full request text the agent receives">${esc(i._request??"")}</textarea></div>
      <div style="text-align:right;margin-top:10px"><span class="err" id="f-err" style="margin-right:12px"></span><button id="f-save">${mode==="edit"?"Save":"Create"}</button></div>
    </div>`;
  const agentSel=form.querySelector("#f-agent");
  agentSel.onchange=()=>{form.querySelector("#f-exec-row").hidden=agentSel.value!=="exec";};
  form.querySelector("#f-cancel").onclick=()=>form.close();
  if(schedTpl){form.querySelector("#f-sk").onchange=schedShow;schedShow();}
  if(mode==="edit"&&i.id){requestText(i.id).then(t=>{if(!form.querySelector("#f-req").value)form.querySelector("#f-req").value=t;});}
  form.querySelector("#f-save").onclick=async()=>{
    const err=form.querySelector("#f-err");err.textContent="";
    const val=s=>form.querySelector(s).value;
    const list=s=>val(s).split("\n").map(x=>x.trim()).filter(Boolean);
    const tags=val("#f-tags").split(",").map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?):(#[0-9a-fA-F]{3,8})$/);return m?{text:m[1].trim(),color:m[2]}:{text:x,color:""};});
    const ucName=val("#f-uc").trim().replace(/^usecase:/,"");
    const keptTags=tags.filter(t=>!t.text.startsWith(UC_PREFIX)||(ucName&&t.text===UC_PREFIX+ucName));
    if(ucName&&!keptTags.some(t=>t.text===UC_PREFIX+ucName))keptTags.push({text:UC_PREFIX+ucName,color:UC_COLOR});
    const prioRaw=val("#f-prio").trim();
    const body={name:val("#f-name").trim(),agent:val("#f-agent"),exec_shell:val("#f-exec"),...(prioRaw===""?{}:{priority:Math.max(0,Math.min(99,parseInt(prioRaw,10)))}),
      state:val("#f-state"),lockdirs:list("#f-lock"),blockedby:list("#f-dep"),tags:keptTags,context:list("#f-ctx"),model:val("#f-model").trim()};
    if(!body.name){err.textContent="name is required";return;}
    let sched;
    if(schedTpl){try{sched=schedRead(i.sched||{});}catch(e){err.textContent=e.message;return;}}
    try{
      if(mode==="edit"){
        const f=await fresh(i.id);Object.assign(f,body);
        if(sched)f.sched={...sched,last_fired:(f.sched&&f.sched.last_fired)||sched.last_fired||""};
        await api(P(i.id)+"?expect_version="+f.version,{method:"PUT",body:JSON.stringify(f)});
        await api(P(i.id)+"/details/0",{method:"PUT",body:JSON.stringify({key:"request",valuetype:"text",value:val("#f-req")})});
        form.close();await loadItems(project);jumpToItem(i.id);
      }else{
        const c=await createItem({...body,requestedby:me||"",createdby:me||"",prework:[],postwork:[]},val("#f-req"));
        form.close();await loadItems(project);jumpToItem(c.id);
      }
    }catch(e){err.textContent="save failed: "+e.message;}
  };
  form.showModal();
}

/* ================= settings (gear) lightboxes ================= */
const sdlg=$("#settings");
sdlg.addEventListener("click",e=>{if(e.target===sdlg)sdlg.close();});
const isAdmin=()=>myRole==="admin";

/* field spec -> row html; values come from the record, JSON fields are pretty-printed */
function fieldRow(f,rec){
  let v=rec?rec[f.key]:undefined;
  if((v===undefined||v===null)&&f.default!==undefined)v=f.default; // records that predate a field
  const id=`sf-${f.key}`;
  let ctl="";
  if(f.type==="readonly")ctl=`<div class="ro">${esc(v==null||v===""?"—":(typeof v==="object"?JSON.stringify(v):v))}</div>`;
  else if(f.type==="textarea")ctl=`<textarea id="${id}" rows="${f.rows||4}" style="font-family:inherit">${esc(v??"")}</textarea>`;
  else if(f.type==="json")ctl=`<textarea id="${id}" rows="${f.rows||4}">${esc(v==null?(f.empty??""):JSON.stringify(v,null,2))}</textarea>`;
  else if(f.type==="select")ctl=`<select id="${id}">${f.options.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(f.type==="bool")ctl=`<select id="${id}"><option ${v?"":"selected"}>false</option><option ${v?"selected":""}>true</option></select>`;
  else if(f.type==="number")ctl=`<input id="${id}" type="number" step="any" value="${esc(v??"")}" style="width:160px">`;
  else if(f.type==="password")ctl=`<input id="${id}" type="password" autocomplete="new-password" placeholder="leave blank to keep">`;
  else ctl=`<input id="${id}" value="${esc(v??"")}">`;
  return `<div class="frow"><label>${esc(f.label||f.key)}</label><div>${ctl}${f.help?`<div class="help">${f.help}</div>`:""}</div></div>`;
}
/* read every editable field back into `out`; throws with the field name on bad JSON/number */
function readFields(fields,out){
  for(const f of fields){
    if(f.type==="readonly")continue;
    const el=sdlg.querySelector(`#sf-${f.key}`);if(!el)continue;
    el.classList.remove("fieldbad");
    const raw=el.value;
    try{
      if(f.type==="json"){ if(raw.trim()==="")out[f.key]=(f.emptyValue!==undefined?f.emptyValue:null); else out[f.key]=JSON.parse(raw); }
      else if(f.type==="number"){ if(raw.trim()==="")out[f.key]=(f.nullable?null:0); else{const n=Number(raw);if(Number.isNaN(n))throw new Error("not a number");out[f.key]=n;} }
      else if(f.type==="password"){ if(raw)out[f.key]=raw; }
      else if(f.type==="bool"){ out[f.key]=(raw==="true"); }
      else out[f.key]=raw;
    }catch(e){el.classList.add("fieldbad");throw new Error(`${f.label||f.key}: ${e.message}`);}
  }
  return out;
}
/* one lightbox shape for every settings record */
function settingsBox(title,fields,rec,onSave,{extra="",canSave=true,note=""}={}){
  sdlg.innerHTML=`<div class="sf" style="padding:16px">
    <div class="dlghead"><h2>${esc(title)}</h2><button class="ghost sm" id="sf-close">close</button></div>
    ${note?`<div class="kv" style="margin:6px 0 10px">${note}</div>`:""}
    ${fields.map(f=>fieldRow(f,rec)).join("")}
    <div style="text-align:right;margin-top:10px"><span class="err" id="sf-err" style="margin-right:12px"></span>
      ${canSave?`<button id="sf-save">Save</button>`:`<span class="kv">read only (admin can edit)</span>`}</div>
    ${extra}
  </div>`;
  sdlg.querySelector("#sf-close").onclick=()=>sdlg.close();
  const save=sdlg.querySelector("#sf-save");
  if(save)save.onclick=async()=>{
    const err=sdlg.querySelector("#sf-err");err.textContent="";
    try{await onSave(readFields(fields,{}));}catch(e){err.textContent=e.message;}
  };
  sdlg.showModal();
}

    try{
      await api(P(i.id)+"/details",{method:"POST",body:JSON.stringify({key:"doc",valuetype:"text",value:v})});
      dlgDirty=false;openDetail(i.id);
    }catch(e){docBtn.textContent="failed: "+e.message;}
  };
  const dl=dlg.querySelector("#dl");
  const closedAt=i.ts&&i.ts.complete;
  details.forEach(d=>{
    const box=document.createElement("div");
    const after=d.key==="doc"&&closedAt&&d.ts&&d.ts>closedAt;
    const head=`${esc(d.key)} <span class="kv">#${esc(d.order)} (${esc(d.valuetype)})${d.by?" · "+esc(d.by):""}${d.ts?" · "+esc(fmtTs(d.ts)):""}${after?" · <b style='color:var(--q)'>post-close</b>":""}</span>`;
    if(d.key==="v2"){
      /* migration leftovers: every V2 field V3 has no column for, kept for reference only */
      box.innerHTML=`<details class="v2"><summary>V2 migration leftovers (${esc(Object.keys(d.value||{}).length)} fields, reference only) — #${esc(d.order)}</summary></details>`;
      const pre=document.createElement("pre");pre.textContent=JSON.stringify(d.value,null,2);box.firstElementChild.appendChild(pre);
      dl.appendChild(box);return;
    }
    const label=d.key==="explained"?`Explained Simply <span class="kv">(ELI5)</span> `:esc(d.key)+" ";
    /* every detail is an accordion, collapsed by default; the one thing that
       must be read — a question widget on an item in state question — opens */
    const isWidget=d.valuetype==="json"&&d.value&&Array.isArray(d.value.fields);
    const open=isWidget&&i.state==="question";
    const text=isWidget?(d.value.title||""):(typeof d.value==="string"?d.value:JSON.stringify(d.value));
    const peek=String(text||"").split("\n").find(l=>l.trim())||"";
    box.innerHTML=`<details class="dbox"${open?" open":""}><summary><h2>${label}${head.slice(esc(d.key).length+1)}</h2>`+
      (peek?`<span class="peek">${esc(peek.slice(0,110))}${peek.length>110?"…":""}</span>`:"")+`</summary></details>`;
    const det=box.firstElementChild;
    if(isWidget){det.appendChild(widgetForm(i,d,open));}
    else{const pre=document.createElement("pre");pre.textContent=typeof d.value==="string"?d.value:JSON.stringify(d.value,null,2);det.appendChild(pre);}
    dl.appendChild(box);
  });
  /* ELI5 (spec: Explain / ELI5) is requested from Actions ▾; while the item is
     flagged explain_requested the pinned top shows progress and the lightbox
     re-renders itself when the "Explained Simply" row lands */
  const eli5s=dlg.querySelector("#eli5-status");
  const maxOrder=details.reduce((m,d)=>Math.max(m,d.order||0),-1);
  const watchExplain=async()=>{
    eli5s.hidden=false;eli5s.textContent="✎ Explaining… this runs immediately on the engine (outside the agent cap) but usually takes 30–60 seconds, longer for a large item. The explanation appears below as \"Explained Simply\" when it lands.";
    const t0=Date.now();
    while(Date.now()-t0<15*60000&&dlg.open){
      await new Promise(r=>setTimeout(r,3000));
      const fresh=await api(P(i.id)+"/details").catch(()=>null);
      if(fresh&&fresh.some(d=>d.key==="explained"&&(d.order||0)>maxOrder)){dlgDirty=false;await load().catch(()=>{});openDetail(i.id);return;}
    }
    if(dlg.open)eli5s.textContent="No explanation yet — is an engine running for this project? The request stays flagged; reopen this item later.";
  };
  if(i.explain_requested)watchExplain();
  /* tag ×: drop that one tag with a tags-only PUT (legal on closed items too) and re-render.
     Removing blocked-by-cluster-restart is how a human keeps a parked item parked on purpose. */
  dlg.querySelectorAll("[data-rmtag]").forEach(a=>a.onclick=async ev=>{
    ev.preventDefault();ev.stopPropagation();
    const text=a.dataset.rmtag;
    try{
      const f=await fresh(i.id);
      f.tags=(f.tags||[]).filter(t=>!(t&&t.text===text));
      await api(P(i.id)+"?expect_version="+f.version,{method:"PUT",body:JSON.stringify(f)});
      dlgDirty=false;await load().catch(()=>{});openDetail(i.id);
    }catch(e){a.textContent="!";a.title="remove failed: "+e.message;}
  });
  /* blocked-by: close the lightbox, jump to that line, flash it */
  dlg.querySelectorAll("[data-dep]").forEach(a=>a.onclick=ev=>{
    ev.preventDefault();
    const dep=a.dataset.dep;
    if(!tryCloseDlg())return;
    jumpToItem(dep);
  });
  if(!dlg.open)dlg.showModal();   // re-render in place when already open (answer/doc/ELI5 refresh)
}

/* dynamic question widget: answers overwrite value in place */
function widgetForm(item,d,expanded){
  const w=d.value,form=document.createElement("div");
  /* the full question text is the required reading on a live question: open;
     a close-gate widget's detail (question, reason, open list, evidence) is
     always shown expanded (2026-09-12: the doubt was hidden behind "more…") */
  expanded=expanded||w.gate==="close";
  form.innerHTML=`<div><b>${esc(w.title)}</b></div><div class="kv">${esc(w.summary||"")}</div>
    ${w.detail?`<details${expanded?" open":""}><summary class="kv">${expanded?"full question":"more…"}</summary><pre>${esc(w.detail)}</pre></details>`:""}`;
  w.fields.forEach((f,idx)=>{
    const fd=document.createElement("div");fd.className="wfield";
    const lab=`<label>${esc(f.label||f.key)}</label>`;
    if(f.type==="checkbox"){
      fd.innerHTML=lab+f.options.map(o=>`<label style="display:block;color:var(--text)">
        <input type="checkbox" data-f="${idx}" value="${esc(o.value)}"
        ${Array.isArray(f.value)&&f.value.includes(o.value)?"checked":""}> ${esc(o.value)} — <span class="kv">${esc(o.desc||"")}</span></label>`).join("");
    }else if(f.type==="radio"){
      fd.innerHTML=lab+f.options.map(o=>`<label style="display:block;color:var(--text)">
        <input type="radio" name="r${idx}" data-f="${idx}" value="${esc(o.value)}"
        ${f.value===o.value?"checked":""}> ${esc(o.value)} — <span class="kv">${esc(o.desc||"")}</span></label>`).join("");
    }else if(f.type==="combo"){
      fd.innerHTML=lab+`<select data-f="${idx}">`+f.options.map(o=>
        `<option value="${esc(o.value)}" ${f.value===o.value?"selected":""}>${esc(o.value)}</option>`).join("")+`</select>`;
    }else if(f.type==="int"){
      fd.innerHTML=lab+`<input type="number" data-f="${idx}" value="${esc(f.value??"")}">`;
    }else{
      fd.innerHTML=lab+`<textarea data-f="${idx}" rows="4" style="width:100%">${esc(f.value??"")}</textarea>`;
    }
    form.appendChild(fd);
  });
  const closed=CLOSED.has(item.state);
  const btn=document.createElement("button");btn.className="wsubmit";btn.textContent=closed?"answered (closed item)":"Submit answer";
  btn.disabled=closed;
  btn.onclick=async()=>{
    const w2=JSON.parse(JSON.stringify(w));
    w2.fields.forEach((f,idx)=>{
      const els=form.querySelectorAll(`[data-f="${idx}"]`);
      if(f.type==="checkbox")w2.fields[idx].value=[...els].filter(e=>e.checked).map(e=>e.value);
      else if(f.type==="radio")w2.fields[idx].value=([...els].find(e=>e.checked)||{}).value??null;
      else if(f.type==="int")w2.fields[idx].value=parseInt(els[0].value||"0",10);
      else w2.fields[idx].value=els[0].value;
    });
    // the record keeps what the human was asked, whatever the title format becomes
    if(w2.gate==="close")w2.answered_question=w.title;
    try{
      await api(P(item.id)+"/details/"+d.order,{method:"PUT",body:JSON.stringify({key:d.key,valuetype:"json",value:w2})});
      const f=await fresh(item.id);
      f.state="queued";f.needs_approval=false;
      await api(P(item.id)+"?expect_version="+f.version,{method:"PUT",body:JSON.stringify(f)});
      dlgDirty=false;btn.textContent="answered ✓";dlg.close();loadItems(project);
    }catch(e){btn.textContent="failed: "+e.message;}
  };
  form.appendChild(btn);
  return form;
}

/* ---------- tabs: Intro | Work queue | Project graph | GraphRAG | Settings ----------
   One header for all; the project picker drives the queue and the graph.
   URL hash: tab=<intro|queue|graph|rag|settings>&p=<project> (the graph adds its own keys). */
const TABS=["intro","queue","graph","rag","settings"];
let tab="queue", graphDrawnFor=null, graphCache={};
function hashParams(){return new URLSearchParams(location.hash.slice(1));}
window.addEventListener("hashchange",async()=>{
  if(!token)return;
  const h=hashParams(),hp=h.get("p"),ht=h.get("tab");
  if(hp&&hp!==project&&(projectsCache||[]).some(x=>rid(x)===hp)){
    if(ht)tab=ht;
    await loadItems(hp);
    graphDrawnFor=null;
    await setTab(tab);
    return;
  }
  if(ht&&ht!==tab)await setTab(ht);
});
function writeTabHash(){
  const h=hashParams();h.set("tab",tab);if(project)h.set("p",project);else h.delete("p");
  if(tab!=="graph")for(const k of [...h.keys()])if(k!=="tab"&&k!=="p")h.delete(k);
  const next="#"+h.toString();
  if(next!==location.hash)history.replaceState(null,"",next);
}
function fillProjPick(){
  const sel=$("#projpick");
  const ps=projectsCache||[];
  // an empty picker looks broken: say why it is empty
  sel.innerHTML=ps.length?ps.map(p=>`<option value="${esc(rid(p))}">${esc(rname(p))}</option>`).join("")
    :`<option value="" disabled selected>no projects yet</option>`;
  sel.disabled=!ps.length;
  if(project&&ps.length)sel.value=project;
  sel.onchange=()=>{loadItems(sel.value);};
}
/* ---- the side panel: one for every tab (2026-10-08), hidden per tab with ‹ and brought back with ›, remembered in this browser ---- */
function sizeTop(){document.documentElement.style.setProperty("--top-h",$("#top").offsetHeight+"px");}
const asideOff=()=>{try{return new Set(JSON.parse(localStorage.getItem("iter5.aside.off")||"[]"));}catch(e){return new Set();}};
function applyAside(){document.body.classList.toggle("aside-off",asideOff().has(tab));}
function resizeViews(){placeDepthTicks(lastMaxDepth);const c=window.IterGraph&&IterGraph.current;if(tab==="graph"&&c&&c.cy)c.cy.resize();if(tab==="settings"&&window.IterSettings)IterSettings.resize();}
function setAside(off){const s=asideOff();if(off)s.add(tab);else s.delete(tab);try{localStorage.setItem("iter5.aside.off",JSON.stringify([...s]));}catch(e){}applyAside();setTimeout(resizeViews,220);}
$("#aside-collapse").onclick=()=>setAside(true);
$("#aside-expand").onclick=()=>setAside(false);
window.addEventListener("resize",sizeTop);

/* ---- account usage: every live engine re-reads each account's 5h / 7d now (POST /api/engines/{e}/probe), once when
   the page opens, every 15 minutes and on ↻; the pane redraws when the engines have answered (or after 90 s) ---- */
let usageBusy=false,usageOpened=false;
async function refreshUsage(manual){
  if(usageBusy||!token)return;
  usageBusy=true;
  const btn=$("#acct-refresh");if(btn){btn.disabled=true;btn.classList.add("busy");}
  try{
    const now=Date.now();
    const live=(enginesCache||[]).filter(e=>e.last_seen&&(now-Date.parse(e.last_seen))<3*(e.ticksec||5)*1000+5000);
    if(!live.length){if(manual)alert("No engine is online to read the accounts' usage.");return;}
    const asked=(await Promise.all(live.map(e=>api("/api/engines/"+encodeURIComponent(rid(e))+"/probe",{method:"POST",body:"{}"})
      .then(r=>({id:rid(e),ts:r.requested})).catch(()=>null)))).filter(Boolean);
    if(!asked.length){if(manual)alert("Could not ask the engines for a usage refresh.");return;}
    const t0=Date.now();
    while(Date.now()-t0<90000){
      await new Promise(r=>setTimeout(r,2000));
      const es=await api("/api/engines").catch(()=>null);if(!es)continue;
      if(asked.every(a=>{const e=es.find(x=>rid(x)===a.id);return !e||e.probe_requested!==a.ts;}))break;
    }
    await load();
  }catch(e){if(manual)alert("usage refresh failed: "+e.message);}
  finally{usageBusy=false;const b=$("#acct-refresh");if(b){b.disabled=false;b.classList.remove("busy");}}
}
$("#acct-refresh").onclick=()=>refreshUsage(true);
setInterval(()=>refreshUsage(false),15*60*1000);

function sizeGraph(){  sizeTop();const h=Math.max(300,window.innerHeight-$("#top").offsetHeight)+"px";["#tab-graph","#tab-settings"].forEach(s=>{const el=$(s);if(el)el.style.height=h;});}
window.addEventListener("resize",()=>{if(tab==="graph"||tab==="settings"){sizeGraph();const c=window.IterGraph&&IterGraph.current;if(c&&c.cy)c.cy.resize();if(window.IterSettings)IterSettings.resize();}});
let settingsMounted=false;
async function setTab(t){
  if(!TABS.includes(t))t="queue";
  tab=t;try{localStorage.setItem("iter5.tab",t);}catch(e){}
  TABS.forEach(x=>document.body.classList.toggle("tab-"+x,x===t&&x!=="queue"));
  applyAside();sizeTop();
  if(t!=="rag"&&window.IterRag)IterRag.hide();
  document.querySelectorAll("#tabs button").forEach(b=>{b.classList.toggle("on",b.dataset.tab===t);b.setAttribute("aria-selected",String(b.dataset.tab===t));});
  writeTabHash();
  if(t==="graph"){sizeGraph();await loadGraph(project);}
  if(t==="settings"){sizeGraph();await showSettings();}
  if(t==="intro")showIntro();
  if(t==="rag")showRag();
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
async function showSettings(){
  if(!window.IterSettings){$("#tab-settings").innerHTML="<div id='g-loading'>settings.js did not load</div>";return;}
  const ctx={api,isAdmin:isAdmin(),myRole,openProject:async name=>{if((projectsCache||[]).some(p=>rid(p)===name)){await loadItems(name);graphDrawnFor=null;await setTab("graph");}},
    onChange:()=>{load().catch(()=>{});}};
  if(!settingsMounted){settingsMounted=true;await IterSettings.mount($("#tab-settings"),ctx);}else await IterSettings.show(ctx);
}
async function loadGraph(p,force){
  const el=$("#tab-graph");
  if(!p){el.innerHTML=`<div id="g-loading"><b>No project yet.</b><br>Design one: Intro → <b>Design a new project</b> creates a designed project you can lay out here before any repository exists.</div>`;return;}
  if(graphDrawnFor===p&&!force){const c=IterGraph.current;if(c&&c.cy){c.cy.resize();}return;}
  el.innerHTML=`<div id="g-loading">loading the project graph for ${esc(p)}…</div>`;
  let G=force?null:graphCache[p];
  try{if(!G){G=await api("/api/projects/"+encodeURIComponent(p)+"/graph");graphCache[p]=G;}}
  catch(e){el.innerHTML=`<div id="g-loading">could not load the graph: ${esc(e.message)}</div>`;return;}
  if(tab!=="graph")return;
  const norm=IterGraph.normalize(G);
  if(!norm.nodes.length){el.innerHTML=`<div id="g-loading"><b>${esc(p)}</b> has no nodes yet.<br><br>
    A project's graph is its <code>*.iter.md</code> files: an engine serving the project syncs them here within seconds of a change.
    A new project made with Intro → <b>Design a new project</b> starts with its project node and default requirements.
    ${isAdmin()?`<br><br>Connect an engine to this project in the <a href="#" data-sgraph="project:${esc(p)}">settings graph</a>.`:""}</div>`;
    el.querySelectorAll("[data-sgraph]").forEach(a=>a.onclick=ev=>{ev.preventDefault();openSettingsGraph(a.dataset.sgraph);});
    graphDrawnFor=null;return;}
  IterGraph.draw(el,G,graphCtx());
  if(window.IterGraphEdit)IterGraphEdit.attach(el,graphCtx());
  graphDrawnFor=p;
  setTimeout(()=>{if(IterGraph.settle)IterGraph.settle();},400);
}
function graphCtx(){return {api,project,isAdmin:isAdmin(),myRole,
  reload:()=>{delete graphCache[project];graphDrawnFor=null;return loadGraph(project,true);},
  onData:raw=>{graphCache[project]=raw;renderMapStats(project).catch(()=>{});},
  openSettings:()=>openSettingsGraph(project?"project:"+project:""),
  openQueue:()=>setTab("queue"),openItem:id=>{setTab("queue").then(()=>{const t=document.querySelector(`[data-id="${CSS.escape(id)}"]`);if(t)t.click();else openDetail(id);});}};}
/* page-wide shortcuts: 1–5 switch tabs, ? shows every shortcut (each tab adds its own) */
function openPageHelp(){
  if(tab==="graph"&&window.IterGraph&&IterGraph.api){IterGraph.api.openHelp();return;}
  if(!window.IterKit)return;
  IterKit.help("Shortcuts",[["Everywhere",[["1","Intro"],["2","Work queue"],["3","Project graph"],["4","GraphRAG"],["5","Settings graph"],["?","Shortcuts for the tab you are on"],["Esc","Close a dialog or menu"]]],
    ["Intro",[["← →","Previous / next slide"],["↑ ↓","More / less detail"]]],
    ["Project graph",[["/","Search"],["F / R","Fit / re-layout"],["N / C / E","New node / connect / configure"],["Mod+C / Mod+V","Copy / paste an edge"]]],
    ["Settings graph",[["/","Find"],["N / C / E","New node / connect / configure (admin)"],["Mod+C / Mod+V","Copy / paste an edge with its settings"]]]]);
}
document.addEventListener("keydown",e=>{
  if(!token||e.metaKey||e.ctrlKey||e.altKey||e.defaultPrevented)return;
  if(document.querySelector("dialog[open]")||(window.IterKit&&IterKit.typing()))return;
  if(/^[1-5]$/.test(e.key)&&$("#top").style.display!=="none"){e.preventDefault();setTab(TABS[+e.key-1]);return;}
  if(e.key==="?"&&tab!=="graph"&&tab!=="settings"){e.preventDefault();openPageHelp();}
});
let introMounted=false;
function introCtx(){return {api,project,isAdmin:isAdmin(),
  // the slides point at iter's own map: show that project (when this server has it), then the node
  openGraph:async(q,p)=>{const own=p||["iter5","iter"].find(n=>projectsCache.some(x=>rid(x)===n));if(own&&projectsCache.some(x=>rid(x)===own)&&project!==own)await loadItems(own);
    await setTab("graph");setTimeout(()=>{if(q&&window.IterGraph&&IterGraph.focus)IterGraph.focus(q);},700);},
  openSettings:id=>openSettingsGraph(id||""),
  openQueue:()=>setTab("queue"),reloadProjects:()=>load(),
  selectProject:async name=>{await load();if(projectsCache.some(x=>rid(x)===name)){await loadItems(name);graphDrawnFor=null;}}};}
function showIntro(){
  if(!window.IterIntro){$("#tab-intro").innerHTML="<div id='g-loading'>intro.js did not load</div>";return;}
  if(!introMounted){IterIntro.mount($("#tab-intro"),introCtx());introMounted=true;}else IterIntro.show(introCtx());
}

let ragMounted=false;
function ragCtx(){return {api,project,isAdmin:isAdmin(),canWrite:myRole!=="viewer",
  openGraph:async q=>{await setTab("graph");setTimeout(()=>{if(q&&window.IterGraph&&IterGraph.focus)IterGraph.focus(q);},700);},
  openQueue:()=>setTab("queue"),
  openItem:id=>{setTab("queue").then(()=>{const t=document.querySelector(`[data-id="${id}"]`);if(t)t.click();});}};}
function showRag(){
  if(!window.IterRag){$("#tab-rag").innerHTML="<div id='g-loading'>rag.js did not load</div>";return;}
  if(!ragMounted){IterRag.mount($("#tab-rag"),ragCtx());ragMounted=true;}else IterRag.show(ragCtx());
}

boot();
setInterval(()=>{
  if(!token||$("#top").style.display==="none"||sdlg.open||document.querySelector("dialog.kit-dlg[open]"))return;
  load().catch(()=>{});
  if(project&&!dlg.open&&!form.open&&!sdlg.open&&menu.hidden)loadItems(project).catch(()=>{});
},10000);
</script>
